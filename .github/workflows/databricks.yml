name: Databricks

# Third engine (D58): the same dlt load and dbt build on Databricks Free Edition,
# weekly and on demand. Not on pull requests: the service principal's OAuth secret
# lives in environment `databricks-ci`, which admits only main (Free Edition has no
# GitHub OIDC federation, so no keyless login as in D57).
on:
  schedule:
    # Off the full hour: GitHub delays or drops schedules at :00 (the first one fired 6 h late)
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dbt-build-databricks:
    name: dbt build (Databricks)
    if: github.ref == 'refs/heads/main'
    environment: databricks-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 55  # up to 20 min waiting for the warehouse, then the run
    defaults:
      run:
        shell: bash
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      # Service principal olist-ci-dbx: may only create schemas in catalog olist_ci
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_CATALOG: olist_ci
      # run_id in the name: a cancelled run's cleanup can't drop a newer run's schemas
      DBT_CI_SCHEMA: ci_dbx_${{ github.run_id }}
      DBT_RAW_SCHEMA: ci_dbx_${{ github.run_id }}_raw
      # datacontract-cli reads its own variables; the contracts' server `databricks-ci`
      # takes host and schemas from DATABRICKS_HOST, DBT_RAW_SCHEMA and DBT_CI_SCHEMA
      DATACONTRACT_DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DATACONTRACT_DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATACONTRACT_DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Kaggle dataset
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/kagglehub
          key: kagglehub-olistbr-brazilian-ecommerce-v2

      # Free Edition's warehouse sometimes can't start for a while ("Cannot create the
      # resource"): wait for it, and when it stays down skip the run instead of
      # failing it (no failure email, D78). Every later step needs available == true;
      # an error of ours (auth, permissions) fails here as before.
      - name: Wait for the SQL warehouse
        id: warehouse
        run: uv run python .github/scripts/databricks_warehouse.py

      # A few months keep the run inside Free Edition's daily compute quota
      - name: Ingest raw data (dlt → Databricks)
        if: steps.warehouse.outputs.available == 'true'
        run: uv run python ingestion/pipeline.py --destination databricks --dataset "$DBT_RAW_SCHEMA" --until 2017-03

      # Data product (D36, D64): the same contracts as in the DuckDB CI job
      - name: Input data contract (raw)
        if: steps.warehouse.outputs.available == 'true'
        run: uv run datacontract ci data-product/contracts/olist-raw.odcs.yaml --server databricks-ci

      - name: dbt deps
        if: steps.warehouse.outputs.available == 'true'
        working-directory: transform
        run: uv run dbt deps

      # The cleanup below must refuse a schema outside ci_*
      - name: Drop guard refuses non-CI schemas
        if: steps.warehouse.outputs.available == 'true'
        working-directory: transform
        env:
          DBT_CI_SCHEMA: marts_guard_check
        run: |
          if uv run dbt run-operation drop_isolated_datasets --target databricks_ci; then
            echo "::error::drop_isolated_datasets accepted schema '$DBT_CI_SCHEMA'"
            exit 1
          fi

      # Elementary's tables first, as in every fresh warehouse (D38)
      - name: dbt run (Elementary tables)
        if: steps.warehouse.outputs.available == 'true'
        working-directory: transform
        run: uv run dbt run --target databricks_ci --select package:elementary

      - name: dbt build (target databricks_ci)
        if: steps.warehouse.outputs.available == 'true'
        working-directory: transform
        run: uv run dbt build --target databricks_ci --exclude package:elementary

      - name: Output data contract (marts)
        if: steps.warehouse.outputs.available == 'true'
        run: uv run datacontract ci data-product/contracts/olist-marts.odcs.yaml --server databricks-ci

      - name: Upload manifest (for the failure email)
        if: always() && steps.warehouse.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-manifest
          path: transform/target/manifest.json
          retention-days: 3

      - name: Drop CI schemas
        if: always() && steps.warehouse.outputs.available == 'true'
        working-directory: transform
        run: uv run dbt run-operation drop_isolated_datasets --target databricks_ci

      # The Python model (D81) runs as a notebook dbt uploads to the service
      # principal's home folder, one folder per schema: this run's go with its schemas
      - name: Delete Python model notebooks
        if: always() && steps.warehouse.outputs.available == 'true'
        run: |
          uv run python - <<'EOF'
          import os
          from databricks.sdk import WorkspaceClient
          from databricks.sdk.errors import NotFound

          w = WorkspaceClient()  # DATABRICKS_HOST / _CLIENT_ID / _CLIENT_SECRET
          root = f"/Users/{w.current_user.me().user_name}/dbt_python_models/{os.environ['DATABRICKS_CATALOG']}"
          try:
              folders = [o.path for o in w.workspace.list(root)]
          except NotFound:
              folders = []
          for path in folders:
              if path.rsplit("/", 1)[-1].startswith(os.environ["DBT_CI_SCHEMA"] + "_"):
                  w.workspace.delete(path, recursive=True)
                  print(f"deleted {path}")
          EOF

  notify-failure:
    name: Email on failure
    needs: [dbt-build-databricks]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # job list + logs of this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download manifest (test descriptions)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name ci-manifest --dir ci-manifest
      - name: Send email
        env:
          DBT_MANIFEST: ci-manifest/manifest.json
          GH_TOKEN: ${{ github.token }}
          SMTP_CONN: ${{ secrets.SMTP_CONN }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
          EVENT_TITLE: "Databricks: ${{ github.event_name }} on ${{ github.ref_name }}"
        run: python3 .github/scripts/notify_failure.py
