name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlfluff-lint:
    name: sqlfluff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # upstream has no floating major tag
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: dbt deps (templater needs package macros)
        working-directory: transform
        run: uv run dbt deps

      - name: sqlfluff lint
        run: uv run sqlfluff lint transform/models transform/tests --format github-annotation-native

  dbt-build:
    name: dbt build
    needs: sqlfluff-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # upstream has no floating major tag
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Kaggle dataset
        uses: actions/cache@v6
        with:
          path: ~/.cache/kagglehub
          key: kagglehub-olistbr-brazilian-ecommerce-v2

      - name: Ingest raw data (dlt → DuckDB)
        run: uv run python ingestion/pipeline.py

      - name: dbt deps
        working-directory: transform
        run: uv run dbt deps

      - name: dbt build (models + tests)
        working-directory: transform
        run: uv run dbt build

      - name: dbt docs generate
        working-directory: transform
        run: uv run dbt docs generate --static

      - name: Prepare docs site
        run: |
          mkdir -p _site
          cp transform/target/static_index.html _site/index.html

      - name: Upload docs artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Same project on BigQuery, isolated per run: datasets ci_pr_<N>_<run_id>_*.
  # Reads the shared `raw` dataset (no ingest here: raw is prod data).
  dbt-build-bigquery:
    name: dbt build (BigQuery)
    if: github.event_name == 'pull_request'
    needs: sqlfluff-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # run_id in the name: a cancelled run's cleanup can't drop a newer run's datasets
      DBT_CI_SCHEMA: ci_pr_${{ github.event.number }}_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # upstream has no floating major tag
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Writes the key to a temp file and sets GOOGLE_APPLICATION_CREDENTIALS (ADC)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: dbt deps
        working-directory: transform
        run: uv run dbt deps

      - name: dbt build (target ci)
        working-directory: transform
        run: uv run dbt build --target ci

      - name: Drop CI datasets
        if: always()
        working-directory: transform
        run: uv run dbt run-operation drop_ci_datasets --target ci

  deploy-docs:
    name: Deploy dbt docs to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dbt-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
