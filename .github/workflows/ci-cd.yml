name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Rebuild incremental models from scratch (dbt --full-refresh)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a prod deploy halfway; superseded PR runs can go
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # GitHub OIDC -> GCP (D57): `terraform output github_workload_identity_provider`.
  # Not a secret: GCP decides which repo, event and environment may use it.
  GCP_WIF_PROVIDER: projects/456327248425/locations/global/workloadIdentityPools/github/providers/olist-analytics-dbt

jobs:
  # Docs-only changes (Markdown outside transform/, issue forms) skip the dbt
  # builds and the prod deploy (D52): `code` is false only then. Gated jobs skip
  # with `if:` (a skipped required check counts as passed); a workflow-level
  # `paths:` filter would leave the required checks waiting on PRs. Manual runs
  # always build.
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # PR: its own commits (three dots: what the head adds over the merge base).
      # Push: the commits since the previous main. Unknown base: build.
      - name: Changed paths
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" != workflow_dispatch ] && files=$(git diff --name-only "$BASE...$HEAD"); then
            printf '%s\n' "$files" | python3 .github/scripts/changed_paths.py >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  sqlfluff-lint:
    name: sqlfluff lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: dbt deps (templater needs package macros)
        working-directory: transform
        run: uv run dbt deps

      - name: sqlfluff lint
        run: uv run sqlfluff lint transform/models transform/tests --format github-annotation-native

  # Type check (same config as Pylance: [tool.pyright] in pyproject.toml)
  pyright:
    name: pyright
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: pyright
        run: uv run pyright

  # Python unit tests (tests/): dlt chunk cursor on a fake dump, dbt summary parsing,
  # alert email decisions. No warehouse or Kaggle download needed
  python-tests:
    name: python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q

      # Security audit reports (/audit skill) stay local; also enforced by gitignore
      # and a pre-commit hook, this catches a commit made with --no-verify
      - name: No audit reports in git
        run: uv run python .claude/skills/audit/audit_tools.py check

      # Data product (D37): a changed contract raises its version, a breaking change
      # its major version (consumers pin a major and must follow)
      - name: Data contract versioning (vs main)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin main
          uv run python data-product/check_compatibility.py origin/main

  # GCP infrastructure as code (infra/, D46): format, config and policy tests
  # (terraform test on mock providers, D47). No credentials here: apply runs locally
  # with the owner's account, plan against live GCP daily in drift.yml (D60)
  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # Providers come from .terraform.lock.hcl (checksums), no backend access
      - name: terraform validate
        run: |
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate

      # infra/tests/*.tftest.hcl: plan on mock providers, asserts the policy rules
      - name: terraform test
        run: terraform test

  # dbt_project_evaluator: project structure rules (naming, DAG shape, docs and test
  # coverage, governance: public marts need contracts, exposures only read public
  # models). Reads dbt's graph, not data, so an empty DuckDB file is enough. Off in
  # every other run (D32); accepted findings: seeds/dbt_project_evaluator_exceptions.csv
  dbt-project-evaluator:
    name: dbt project evaluator
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DBT_PROJECT_EVALUATOR: "true"
      DBT_DUCKDB_PATH: evaluator.duckdb  # relative to transform/, fresh on the runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: dbt deps
        working-directory: transform
        run: uv run dbt deps

      - name: dbt build (evaluator models + rule tests)
        working-directory: transform
        run: uv run dbt build --select package:dbt_project_evaluator dbt_project_evaluator_exceptions

  # Airflow image builds, `dbt parse` writes the manifest Cosmos renders from, and
  # both DAGs parse (check_dags.py). No DB or warehouse needed. A dummy key makes
  # the BigQuery DAG render; parsing never authenticates.
  airflow-dags:
    name: airflow DAGs parse
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Airflow image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: airflow/Dockerfile
          tags: olist-airflow:ci
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max

      # The image as built: code, dbt packages and manifest baked in, nothing mounted
      - name: Parse DAGs
        run: |
          echo '{}' > "$RUNNER_TEMP/dummy-key.json"
          docker run --rm \
            -v "$RUNNER_TEMP/dummy-key.json:/opt/gcp/key.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/opt/gcp/key.json \
            --entrypoint python olist-airflow:ci /opt/project/airflow/check_dags.py

  # Required check: gating it on pyright and the Python tests blocks merges with
  # type errors or failing tests. Skipped for docs-only changes (still passes)
  dbt-build:
    name: dbt build
    needs: [changes, sqlfluff-lint, pyright, python-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Kaggle dataset
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/kagglehub
          key: kagglehub-olistbr-brazilian-ecommerce-v2

      - name: Ingest raw data (dlt → DuckDB)
        run: uv run python ingestion/pipeline.py

      # Data product (D36): the source must meet the input contract before dbt runs
      - name: Input data contract (raw)
        run: uv run datacontract ci data-product/contracts/olist-raw.odcs.yaml --server local

      - name: dbt deps
        working-directory: transform
        run: uv run dbt deps

      # Fresh ingest just ran, so this checks the `_loaded_at` plumbing (warn-only, D18)
      - name: dbt source freshness
        working-directory: transform
        run: uv run dbt source freshness

      # Elementary's tables first (D38): in a fresh warehouse its schema-change tests
      # on sources would start before dbt creates them. The build then skips them.
      - name: dbt run (Elementary tables)
        working-directory: transform
        run: uv run dbt run --select package:elementary

      - name: dbt build (models + tests)
        working-directory: transform
        run: uv run dbt build --exclude package:elementary

      # Test descriptions for the failure email (notify-failure); written even when
      # the build fails, since dbt parses before it runs anything
      - name: Upload manifest (for the failure email)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-manifest
          path: transform/target/manifest.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

      # Data product (D36): the marts keep the output contract's promises (schema,
      # keys, relationships, quality, freshness), and the descriptor, contracts and
      # dbt project agree with each other
      - name: Output data contract (marts)
        run: uv run datacontract ci data-product/contracts/olist-marts.odcs.yaml --server local

      - name: Data product checks
        run: uv run pytest data-product -q

      # Semantic layer (D35): every entity, dimension, measure and metric queries
      # the marts just built
      - name: Validate semantic layer (MetricFlow)
        working-directory: transform
        run: uv run mf validate-configs

      # Every dashboard page renders on the marts just built (headless AppTest),
      # and its KPI tiles equal the semantic layer's metrics (mf query)
      - name: Dashboard tests
        run: uv run pytest dashboard -q

  # Slim CI on BigQuery, isolated per run: datasets ci_pr_<N>_<run_id>_*.
  # Builds only modified models + children; unmodified parents are read from prod
  # (--defer to the manifest of the last successful deploy). Full build if none.
  # Reads the shared `raw` dataset (no ingest here: raw is prod data).
  # Not on Dependabot PRs: GitHub gives them no Actions secrets, so there is no
  # GCP key (and it shouldn't get one). Their changes reach BigQuery on main.
  dbt-build-bigquery:
    name: dbt build (BigQuery)
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && needs.changes.outputs.code == 'true'
    needs: [changes, sqlfluff-lint]
    permissions:
      contents: read
      actions: read  # download the prod manifest artifact
      id-token: write  # OIDC token for Workload Identity Federation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # run_id in the name: a cancelled run's cleanup can't drop a newer run's datasets
      DBT_CI_SCHEMA: ci_pr_${{ github.event.number }}_${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # No key (D57): exchanges the job's OIDC token for service account olist-ci
      # and sets GOOGLE_APPLICATION_CREDENTIALS (ADC). olist-ci reads the prod
      # datasets slim CI defers to, writes only the ci_* datasets it creates. GCP
      # lets only pull_request tokens of this repo impersonate it (infra/wif.tf).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: olist-ci@olist-analytics-dbt-472315.iam.gserviceaccount.com

      - name: dbt deps
        working-directory: transform
        run: uv run dbt deps

      # The cleanup below must refuse a dataset outside ci_*. A name that doesn't
      # exist: if the guard is ever broken, this drops nothing real.
      - name: Drop guard refuses non-CI datasets
        working-directory: transform
        env:
          DBT_CI_SCHEMA: marts_guard_check
        run: |
          if uv run dbt run-operation drop_isolated_datasets --target ci; then
            echo "::error::drop_isolated_datasets accepted dataset '$DBT_CI_SCHEMA'"
            exit 1
          fi

      # Newest prod-manifest artifact from main: uploaded only after a successful
      # prod build. Not "last green run on main": docs-only merges skip the deploy
      # and upload none (D52)
      - name: Download prod manifest (last prod deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=prod-manifest&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --name prod-manifest --dir prod-state; then
            echo "SLIM_CI=true" >> "$GITHUB_ENV"
          else
            echo "::notice::No prod manifest found, running a full build"
          fi

      # Per-run datasets start empty: Elementary's tables first, as in `dbt build`
      - name: dbt run (Elementary tables, target ci)
        working-directory: transform
        run: uv run dbt run --target ci --select package:elementary

      - name: dbt build (target ci)
        working-directory: transform
        run: |
          if [ "$SLIM_CI" = true ]; then
            uv run dbt build --target ci --select state:modified+ --exclude package:elementary --defer --state ../prod-state
          else
            uv run dbt build --target ci --exclude package:elementary
          fi

      - name: Drop CI datasets
        if: always()
        working-directory: transform
        run: uv run dbt run-operation drop_isolated_datasets --target ci

  # CD: main → ingest raw + build prod on BigQuery, publish docs and the manifest
  # that slim CI defers to. Unit tests already ran in the PR (see D13).
  deploy-prod:
    name: Deploy to BigQuery prod
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    needs: [changes, dbt-build]
    # The prod writer (dbt-runner) trusts only OIDC tokens of this environment,
    # which admits only main (D45, D57).
    # url: link on the deployment card, the public dashboard over prod marts
    environment:
      name: prod
      url: https://olist-analytics-dbt.streamlit.app/
    permissions:
      contents: read
      actions: read  # download the previous prod manifest artifact
      id-token: write  # OIDC token for Workload Identity Federation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Source columns the load added to raw or found missing, for notify-schema (D61)
    outputs:
      new_columns: ${{ steps.ingest.outputs.new_columns }}
      removed_columns: ${{ steps.ingest.outputs.removed_columns }}
    defaults:
      run:
        shell: bash
    steps:
      # Full history: the build scope diffs uv.lock against the last deploy's commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Kaggle dataset
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/kagglehub
          key: kagglehub-olistbr-brazilian-ecommerce-v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: dbt-runner@olist-analytics-dbt-472315.iam.gserviceaccount.com

      # Last output line = feed status JSON; new_columns / removed_columns go to
      # notify-schema, orders_loaded to the build scope
      - name: Ingest raw data (dlt → BigQuery)
        id: ingest
        run: |
          uv run python ingestion/pipeline.py --destination bigquery | tee ingest.log
          echo "orders_loaded=$(tail -n 1 ingest.log | jq '.orders_loaded')" >> "$GITHUB_OUTPUT"
          echo "new_columns=$(tail -n 1 ingest.log | jq -c '.new_columns // {}')" >> "$GITHUB_OUTPUT"
          echo "removed_columns=$(tail -n 1 ingest.log | jq -c '.removed_columns // {}')" >> "$GITHUB_OUTPUT"

      - name: dbt deps
        working-directory: transform
        run: uv run dbt deps

      # Warns once order tables stop receiving new months (static dump, D18)
      - name: dbt source freshness (target prod)
        working-directory: transform
        run: uv run dbt source freshness --target prod

      # Baseline for the Elementary step and the build scope below: the last
      # successful prod deploy's manifest, found as in slim CI, and its commit
      - name: Download prod manifest (last prod deploy)
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r run_id sha < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=prod-manifest&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0] // empty | "\(.workflow_run.id) \(.workflow_run.head_sha)"') || true
          if [ -n "$run_id" ] && gh run download "$run_id" --name prod-manifest --dir prod-state; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No prod manifest found, Elementary's models and the build run in full"
          fi

      # Slim deploy (D66). With no new data in raw, prod can only differ from the
      # project where the project changed since the last successful deploy:
      # state:modified+ against its manifest (changed models, seeds, snapshots, tests,
      # the macros they call, configs, and everything downstream). Full build when
      # that baseline isn't enough: no manifest, a manual run (the way to rebuild
      # prod), orders loaded by this run (new data is no project change), or a changed
      # uv.lock (a dbt or adapter upgrade changes materialization SQL, which the
      # state comparison doesn't see).
      - name: Build scope
        id: scope
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          ORDERS_LOADED: ${{ steps.ingest.outputs.orders_loaded }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          if [ ! -f prod-state/manifest.json ]; then reason="no prod manifest"
          elif [ "$MANUAL" = true ]; then reason="manual run"
          elif [ "$ORDERS_LOADED" != 0 ]; then reason="the load brought ${ORDERS_LOADED:-an unknown number of} orders"
          elif ! git diff --quiet "$BASELINE_SHA" HEAD -- uv.lock; then reason="uv.lock changed since ${BASELINE_SHA:0:7} (or that commit is unknown)"
          fi
          if [ -n "${reason:-}" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "Full prod build: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "scope=slim" >> "$GITHUB_OUTPUT"
            echo "Slim prod build: state:modified+ since ${BASELINE_SHA:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Never with --full-refresh: the tables hold the run and test history (D38).
      # Prod already has the tables: only Elementary's models changed since the last
      # deploy run (package upgrade, config), else the step is skipped (D56). A manual
      # run with full_refresh runs them all (e.g. a table dropped by hand).
      - name: dbt run (Elementary tables, target prod)
        working-directory: transform
        env:
          ALL_MODELS: ${{ inputs.full_refresh && 'true' || '' }}
        run: |
          if [ -f ../prod-state/manifest.json ] && [ -z "$ALL_MODELS" ]; then
            select='package:elementary,state:modified+'
            changed=$(uv run dbt ls --target prod --resource-type model --select "$select" --state ../prod-state --output name -q)
            if [ -z "$changed" ]; then
              echo "Elementary models unchanged since the last prod deploy: step skipped" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            uv run dbt run --target prod --select "$select" --state ../prod-state
          else
            uv run dbt run --target prod --select package:elementary
          fi

      # Unselected parents are prod's own tables, so a slim build needs no --defer.
      # Nothing selected: the step is skipped (an empty build would still run the
      # on-run-end hooks). The manifest uploaded below covers the whole project either way.
      - name: dbt build (target prod)
        working-directory: transform
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
          FULL_REFRESH: ${{ inputs.full_refresh && '--full-refresh' || '' }}
        run: |
          args=(--target prod --exclude-resource-type unit_test --exclude package:elementary)
          if [ "$SCOPE" = slim ]; then
            args+=(--select state:modified+ --state ../prod-state)
            selected=$(uv run dbt ls "${args[@]}" --output name -q)
            if [ -z "$selected" ]; then
              echo "No project changes since the last prod deploy: build skipped" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Slim build: $(wc -l <<< "$selected") nodes" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          uv run dbt build "${args[@]}" $FULL_REFRESH

      - name: dbt docs generate
        working-directory: transform
        env:
          # dbt-bigquery's catalog query: agate warns about a missing table_owner column, harmless
          PYTHONWARNINGS: ignore::RuntimeWarning:agate.type_tester
        run: uv run dbt docs generate --target prod --static

      - name: Upload prod manifest (state for slim CI)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: prod-manifest
          path: transform/target/manifest.json
          retention-days: 90

      - name: Prepare docs site
        run: |
          mkdir -p _site
          cp transform/target/static_index.html _site/index.html
          # Data product page + contract catalog at /data-product/ (D37)
          uv run python data-product/build_site.py _site/data-product

      # Observability report at /elementary/ (D38): test and run history, anomaly
      # charts, from the `elementary` dataset prod builds fill. The CLI runs in its
      # own venv (it would downgrade networkx in uv.lock), installed only from a
      # hash-pinned lock: this job holds the prod credentials. It does not create
      # the output folder. Optional: a broken report must not hold back the prod
      # docs and the Airflow image (next step leaves a stub page and a warning).
      - name: Elementary report
        id: edr
        continue-on-error: true
        working-directory: transform
        run: |
          mkdir -p "$RUNNER_TEMP/edr" "$GITHUB_WORKSPACE/_site/elementary"
          printf 'anonymous_usage_tracking: false\n' > "$RUNNER_TEMP/edr/config.yml"
          uv venv --python 3.12 "$RUNNER_TEMP/edr-venv"
          uv pip install --python "$RUNNER_TEMP/edr-venv" --require-hashes \
            -r "$GITHUB_WORKSPACE/.github/edr-requirements.txt"
          # edr runs dbt as a subprocess: the venv's dbt must come first on PATH
          export PATH="$RUNNER_TEMP/edr-venv/bin:$PATH"
          edr report --profiles-dir . --profile-target prod \
            --config-dir "$RUNNER_TEMP/edr" --target-path "$RUNNER_TEMP/edr" \
            --file-path "$GITHUB_WORKSPACE/_site/elementary/index.html" \
            --env prod --days-back 30 --open-browser false

      - name: Elementary report stub
        if: steps.edr.outcome == 'failure'
        run: |
          mkdir -p _site/elementary
          echo '<!doctype html><meta charset="utf-8"><title>Elementary report</title><p>The Elementary report failed to build in the last deploy; see the GitHub Actions log.</p>' \
            > _site/elementary/index.html
          echo "::warning::Elementary report failed: published a stub at /elementary/"
          echo "Elementary report failed: stub page published" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy-docs:
    name: Deploy dbt docs to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy-prod
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
  # ghcr.io/<owner>/olist-airflow:<sha> and :latest once prod is deployed, so the
  # image matches prod. Same DAG parse check as in PR CI before pushing.
  publish-airflow-image:
    name: Publish Airflow image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy-prod
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Airflow image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: airflow/Dockerfile
          tags: olist-airflow:release
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max

      - name: Parse DAGs
        run: |
          echo '{}' > "$RUNNER_TEMP/dummy-key.json"
          docker run --rm \
            -v "$RUNNER_TEMP/dummy-key.json:/opt/gcp/key.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/opt/gcp/key.json \
            --entrypoint python olist-airflow:release /opt/project/airflow/check_dags.py

      - name: Push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/olist-airflow"  # GHCR names are lowercase
          for tag in "$GITHUB_SHA" latest; do
            docker tag olist-airflow:release "$image:$tag"
            docker push --quiet "$image:$tag"
          done
          echo "Published \`$image:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # A prod load added source columns to raw or found raw columns missing from the
  # source (D61): a SCHEMA email, the deploy stays green (new columns stop at raw;
  # a removed one gets nulls, which only a NOT NULL test fails). Own job, so the
  # SMTP secret stays out of the prod writer's job. Runs after a later deploy step
  # failed too: the load happened either way.
  notify-schema:
    name: Email on source column changes
    needs: deploy-prod
    if: >-
      always() && (
      (needs.deploy-prod.outputs.new_columns != '' && needs.deploy-prod.outputs.new_columns != '{}') ||
      (needs.deploy-prod.outputs.removed_columns != '' && needs.deploy-prod.outputs.removed_columns != '{}'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Send email
        env:
          # Via env: column names come from the source files
          NEW_COLUMNS: ${{ needs.deploy-prod.outputs.new_columns }}
          REMOVED_COLUMNS: ${{ needs.deploy-prod.outputs.removed_columns }}
          SMTP_CONN: ${{ secrets.SMTP_CONN }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
        run: python3 .github/scripts/notify_schema.py

  # Email the failed jobs (failed step + log excerpt / dbt summary) to the list in
  # repo variable ALERT_EMAILS, via secret SMTP_CONN (same URI as airflow/.env).
  # GitHub's own notification only reaches the person who triggered the run.
  # `needs` must list every other job (tests/test_ci_workflow.py). A missing secret
  # or recipient list fails this job instead of skipping the email. Not on
  # Dependabot PRs: they get no Actions secrets (the PR shows the failure).
  notify-failure:
    name: Email on failure
    needs: [changes, sqlfluff-lint, pyright, python-tests, terraform, dbt-project-evaluator, airflow-dags, dbt-build, dbt-build-bigquery, deploy-prod, notify-schema, deploy-docs, publish-airflow-image]
    if: failure() && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # job list + logs of this run
    steps:
      # On PRs the alert code comes from the base commit, not the PR head: the
      # job holds SMTP_CONN, so a PR can't swap the script that reads it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Download manifest (test descriptions)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name ci-manifest --dir ci-manifest
      - name: Send email
        env:
          DBT_MANIFEST: ci-manifest/manifest.json
          GH_TOKEN: ${{ github.token }}
          SMTP_CONN: ${{ secrets.SMTP_CONN }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
          # Via env, never inlined into the script: PR titles are user input
          # Quoted: an unquoted ` #` starts a YAML comment and cut the expression
          EVENT_TITLE: "${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('{0} on {1}', github.event_name, github.ref_name) }}"
        run: python3 .github/scripts/notify_failure.py
