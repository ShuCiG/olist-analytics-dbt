[project]
name = "olist-analytics-dbt"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "dlt[bigquery,duckdb]>=1.31.0",
    "duckdb>=1.5.6",  # dbt-duckdb merge strategy needs >= 1.4 (D20)
    "kagglehub>=1.0.2",
]

[dependency-groups]
dashboard = [
    "altair>=6.3.0",
    "streamlit>=1.65.0",
]
dev = [
    "datacontract-cli[bigquery,duckdb]>=1.2.6",
    "dbt-metricflow>=0.15.0",
    "pre-commit>=4.6.2",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "sqlfluff>=4.4.0",
    "sqlfluff-templater-dbt>=4.4.0",
]

# `uv sync` installs the dashboard too (CI type-checks and smoke-tests it)
[tool.uv]
default-groups = ["dev", "dashboard"]

# Python unit tests (tests/): `uv run pytest`. The dashboard smoke test needs built
# marts and runs separately (`uv run pytest dashboard`)
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests import the repo's packages: ingestion, alerting

# Pylance in VS Code reads the same section, so editor and CI agree
[tool.pyright]
include = ["ingestion", "dashboard", "alerting", "tests", "data-product", ".github/scripts", ".claude/skills/audit"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

# airflow/ runs in the Docker image (Airflow + Cosmos aren't in this venv, by
# design: dependency clash with dbt). Pylance still analyses open files there;
# its imports can't resolve here. CI job `airflow DAGs parse` covers that code.
[[tool.pyright.executionEnvironments]]
root = "airflow"
reportMissingImports = "none"
# `task_a >> task_b` sets a dependency; untyped here, it looks like a no-op
reportUnusedExpression = "none"

[[tool.pyright.executionEnvironments]]
root = "ingestion"

# Streamlit puts the entrypoint's folder on sys.path (`import warehouse`)
[[tool.pyright.executionEnvironments]]
root = "dashboard"
