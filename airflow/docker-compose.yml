# Local Airflow 3 for the olist ELT DAGs. Not for production: LocalExecutor,
# no login (all users admin), fixed local secrets (override in airflow/.env).
# Ports are published on 127.0.0.1 only: no login is acceptable because nothing
# but this machine reaches the UI, the API or Mailpit.
# The code is baked into the image (prod-like): a code change needs a rebuild or
# another published image. Live edit: add docker-compose.dev.yml (see there).
#   docker compose -f airflow/docker-compose.yml up -d --build
#   UI: http://localhost:8080, alert emails (Mailpit): http://localhost:8025,
#   Elementary reports: http://localhost:8081 (also in the UI: Browse → Elementary)
# BigQuery DAG: set GCP_KEY_FILE in airflow/.env (see .env.example).

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  # Default: built locally. Or the image CD publishes on every merge, by commit:
  # OLIST_AIRFLOW_IMAGE=ghcr.io/shucig/olist-airflow:<sha> (`pull`, then `up` without --build)
  image: ${OLIST_AIRFLOW_IMAGE:-olist-airflow:local}
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
    # Elementary reports in the UI (Browse menu), served by the API server
    AIRFLOW__CORE__PLUGINS_FOLDER: /opt/project/airflow/plugins
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Shared by the components that sign / check task tokens; local-only default
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-only-not-a-secret}
    # Signs log requests from the UI to the scheduler's log server; unset = each
    # component picks a random key and the UI can't fetch task logs
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-local-dev-only-not-a-secret}
    # Encrypts Variables / Connections in the metadata DB. Unset = each component
    # generates its own key, and a Variable set from one container reads as missing
    # in the others ("Can't decrypt _val": alert recipients fell back to the
    # default). Local-only value; override with FERNET_KEY in airflow/.env.
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-9_FbOjNrmDC1NRZOoqnl7B4DQT8bG5qiicB_aodzVO8=}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Every task re-imports the DAG file (Cosmos + manifest): ~5 s normally, but
    # >30 s (the default limit) while the PC was busy building an image, which
    # failed a whole run with "DagBag import timeout".
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
    # Task -> API server calls time out after 5 s by default and are retried. A
    # retried XCom push is not idempotent: when both DAGs start at :00 a push took
    # 6.2 s, the retry hit "Unique constraint violation" (409) and failed the task.
    AIRFLOW__WORKERS__EXECUTION_API_TIMEOUT: "30"
    # dbt's partial parse survives a recreated container (new image): Cosmos keeps
    # the producer's partial_parse.msgpack here (default /tmp/cosmos, container
    # filesystem), elementary_tables its target path (D55)
    AIRFLOW__COSMOS__CACHE_DIR: /opt/dbt-cache/cosmos
    # Mounted key; dlt and dbt-bigquery read it as ADC. Empty placeholder = no
    # key, and the BigQuery DAG is not created.
    GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp/key.json
    # Alert emails (airflow/dags/olist_alerts.py). Default: local Mailpit, catches
    # everything. Real SMTP: set SMTP_CONN in airflow/.env (see .env.example).
    # Extras are truthy strings: leave a flag out rather than setting it to false.
    AIRFLOW_CONN_SMTP_DEFAULT: ${SMTP_CONN:-smtp://mailpit:1025?disable_ssl=true&disable_tls=true&from_email=airflow%40olist.local}
  volumes:
    # Data only (warehouse files); the code comes from the image
    - ../data:/opt/project/data
    - ${GCP_KEY_FILE:-./gcp-key.placeholder}:/opt/gcp/key.json:ro
    - kagglehub-cache:/home/airflow/.cache/kagglehub
    - dlt-pipelines:/home/airflow/.dlt
    # dbt partial parse caches (see AIRFLOW__COSMOS__CACHE_DIR)
    - dbt-cache:/opt/dbt-cache
    # Task logs written by the scheduler (LocalExecutor), read by the UI
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy

services:
  # Local SMTP sink for the alert emails: nothing leaves the machine
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:8025:8025"
    restart: always

  # Elementary reports the DAGs' edr_report task writes, on their own port. Same
  # image as Airflow (no extra image to pin), Python's static file server: local
  # use only, read-only mount.
  elementary-reports:
    image: ${OLIST_AIRFLOW_IMAGE:-olist-airflow:local}
    entrypoint: ["python", "-m", "http.server", "8081", "--directory", "/srv/elementary"]
    volumes:
      - ../data/elementary:/srv/elementary:ro
    ports:
      - "127.0.0.1:8081:8081"
    restart: always

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        # dbt packages (Cosmos: install_dbt_deps=False) and the manifest Cosmos
        # renders the DAGs from (LoadMode.DBT_MANIFEST) are built into the image.
        # Dev mode mounts the repo over them: rebuild both from the working tree
        # (re-run this service after changing dbt models).
        if [ "$${OLIST_DEV_MOUNT:-}" = "1" ]; then
          cd /opt/project/transform
          /opt/project-venv/bin/dbt deps
          /opt/project-venv/bin/dbt parse --target-path target_airflow
        fi
        # DuckDB allows one writer: the DuckDB DAG's dbt tasks share one slot
        airflow pools set duckdb 1 "DuckDB single-writer lock"
        # Alert settings, visible and editable in Admin → Variables. Only created
        # when missing: re-running init keeps values changed in the UI.
        airflow variables get olist_alert_emails >/dev/null 2>&1 \
          || airflow variables set olist_alert_emails data-team@olist.local \
               --description "Alert recipients, comma-separated"
        airflow variables get olist_stale_after_hours >/dev/null 2>&1 \
          || airflow variables set olist_stale_after_hours 24 \
               --description "STALE email after this many hours without new orders"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    # Tasks talk to the API server (Execution API) from their first second: queued
    # before it is up, they die in "Pre Execute" with no log. depends_on can't
    # guard this: when Docker itself restarts, the daemon brings `restart: always`
    # containers back without compose, so the wait lives in the command.
    command:
      - bash
      - -c
      - |
        until curl -sf http://airflow-apiserver:8080/api/v2/version >/dev/null; do
          echo "waiting for airflow-apiserver"; sleep 3
        done
        exec airflow scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
      # Mostly for ordering on `up`; the wait loop above is what actually guards
      airflow-apiserver:
        condition: service_started

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  kagglehub-cache:
  dlt-pipelines:
  dbt-cache:
  airflow-logs:
