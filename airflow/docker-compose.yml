# Local Airflow 3 for the olist ELT DAGs. Not for production: LocalExecutor,
# no login (all users admin), fixed local secrets.
#   docker compose -f airflow/docker-compose.yml up -d --build
#   UI: http://localhost:8080, alert emails (Mailpit): http://localhost:8025
# BigQuery DAG: set GCP_KEY_FILE in airflow/.env (see .env.example).

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  image: olist-airflow:local
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Shared by the components that sign / check task tokens; local-only value
    AIRFLOW__API_AUTH__JWT_SECRET: local-dev-only-not-a-secret
    # Signs log requests from the UI to the scheduler's log server; unset = each
    # component picks a random key and the UI can't fetch task logs
    AIRFLOW__API__SECRET_KEY: local-dev-only-not-a-secret
    # Encrypts Variables / Connections in the metadata DB. Unset = each component
    # generates its own key, and a Variable set from one container reads as missing
    # in the others ("Can't decrypt _val": alert recipients fell back to the
    # default). Local-only value; override with FERNET_KEY in airflow/.env.
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-9_FbOjNrmDC1NRZOoqnl7B4DQT8bG5qiicB_aodzVO8=}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Mounted key; dlt and dbt-bigquery read it as ADC. Empty placeholder = no
    # key, and the BigQuery DAG is not created.
    GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp/key.json
    # Alert emails (airflow/dags/olist_alerts.py). Default: local Mailpit, catches
    # everything. Real SMTP: set SMTP_CONN in airflow/.env (see .env.example).
    # Extras are truthy strings: leave a flag out rather than setting it to false.
    AIRFLOW_CONN_SMTP_DEFAULT: ${SMTP_CONN:-smtp://mailpit:1025?disable_ssl=true&disable_tls=true&from_email=airflow%40olist.local}
  volumes:
    - ..:/opt/project
    - ${GCP_KEY_FILE:-./gcp-key.placeholder}:/opt/gcp/key.json:ro
    - kagglehub-cache:/home/airflow/.cache/kagglehub
    - dlt-pipelines:/home/airflow/.dlt
    # Task logs written by the scheduler (LocalExecutor), read by the UI
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy

services:
  # Local SMTP sink for the alert emails: nothing leaves the machine
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "8025:8025"
    restart: always

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        # dbt packages once for all tasks (Cosmos: install_dbt_deps=False), and
        # the manifest Cosmos renders the DAGs from (LoadMode.DBT_MANIFEST).
        # Re-run this service after changing dbt models.
        cd /opt/project/transform
        /opt/project-venv/bin/dbt deps
        /opt/project-venv/bin/dbt parse --target-path target_airflow
        # DuckDB allows one writer: the DuckDB DAG's dbt tasks share one slot
        airflow pools set duckdb 1 "DuckDB single-writer lock"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  kagglehub-cache:
  dlt-pipelines:
  airflow-logs:
