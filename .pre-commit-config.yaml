# Install once: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Local hook: uses the sqlfluff version pinned in uv.lock (same as CI)
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: uv run sqlfluff lint
        language: system
        files: ^transform/(models|tests|macros|snapshots|analyses)/.*\.sql$
        require_serial: true

      # Whole project, not just staged files: config ([tool.pyright]) decides the scope
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      # Python unit tests (tests/, ~45 s) when the code they cover changes
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        files: ^(ingestion|alerting|tests|airflow/dags)/.*\.py$
        pass_filenames: false
