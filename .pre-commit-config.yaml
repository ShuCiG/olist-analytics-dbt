# Install once: uv run pre-commit install (sets up the pre-commit and pre-push hooks)
default_install_hook_types: [pre-commit, pre-push]
# Hooks run at commit only, unless they name their stage (ci-local: pre-push)
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      # Security audit reports name weak spots and may quote secrets: even a forced
      # `git add -f .audit/...` must not get into a commit
      - id: no-audit-reports
        name: block .audit/ (local security reports)
        entry: .audit/ holds local security findings and must never be committed
        language: fail
        files: ^\.audit/

  # Local hook: uses the sqlfluff version pinned in uv.lock (same as CI)
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: uv run sqlfluff lint
        language: system
        files: ^transform/(models|tests|macros|snapshots|analyses)/.*\.sql$
        require_serial: true

      # Whole project, not just staged files: config ([tool.pyright]) decides the scope
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      # Python unit tests (tests/, ~45 s) when the code they cover changes
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        files: ^(ingestion|alerting|tests|airflow/dags|\.claude/skills/audit)/.*\.py$
        pass_filenames: false

      # dbt_project_evaluator (CI job `dbt project evaluator`) when the dbt graph
      # changes: same command on a throwaway DuckDB file, ~1 min, no network (D108)
      - id: dbt-project-evaluator
        name: dbt project evaluator
        entry: uv run python .github/scripts/ci_local.py --only evaluator
        language: system
        files: ^transform/(models/|tests/|seeds/dbt_project_evaluator_exceptions\.csv$|dbt_project\.yml$|packages\.yml$)
        pass_filenames: false
        require_serial: true

      # Every CI check that needs no cloud, before a push reaches a PR (D108).
      # Skip on purpose only: git push --no-verify
      - id: ci-local
        name: ci-local (CI checks without cloud)
        entry: uv run python .github/scripts/ci_local.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        require_serial: true
