olist:
  # Default target; DBT_TARGET picks another one for tools without a --target flag
  # (MetricFlow's `mf`: DBT_TARGET=prod uv run mf query ...)
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      # Relative to transform/ (dbt is run from there); override for Docker/CI
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/olist.duckdb') }}"
      schema: main
      threads: 4
    # BigQuery. Auth = Application Default Credentials: set
    # GOOGLE_APPLICATION_CREDENTIALS to the service-account key path (locally)
    # or let google-github-actions/auth set it (CI). No key path in the repo.
    # maximum_bytes_billed: per-query cost guard (1 GB, same as the dashboard). The
    # largest query bills < 100 MB; a runaway scan fails instead of being billed.
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'olist-analytics-dbt-472315') }}"
      dataset: main
      location: EU
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      maximum_bytes_billed: 1000000000
      priority: interactive
    # Per-PR CI on BigQuery: datasets become <DBT_CI_SCHEMA>_staging, ..._marts
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'olist-analytics-dbt-472315') }}"
      dataset: "{{ env_var('DBT_CI_SCHEMA', 'ci_local') }}"
      location: EU
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      maximum_bytes_billed: 1000000000
      priority: interactive
    # Airflow's BigQuery DAG: datasets airflow_staging, ..._marts; reads airflow_raw
    # (DBT_RAW_SCHEMA). Kept apart from prod, which GitHub Actions CD owns.
    airflow:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'olist-analytics-dbt-472315') }}"
      dataset: airflow
      location: EU
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      maximum_bytes_billed: 1000000000
      priority: interactive
    # Databricks (Free Edition, third engine, D58): catalog `olist`, schemas named
    # as in prod. Personal access token from the environment, never in the repo.
    # No byte cap like BigQuery's: the SQL warehouse's auto-stop and size are the
    # cost guards.
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'unset') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', 'unset') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'unset') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'olist') }}"
      schema: main
      threads: 4
    # Scheduled CI on Databricks (.github/workflows/databricks.yml): service principal
    # olist-ci-dbx (OAuth machine-to-machine), which can only create schemas in
    # catalog olist_ci. Schemas are <DBT_CI_SCHEMA>_staging, ..._marts, dropped after.
    databricks_ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'unset') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', 'unset') }}"
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID', 'unset') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET', 'unset') }}"
      catalog: olist_ci
      schema: "{{ env_var('DBT_CI_SCHEMA', 'ci_local') }}"
      threads: 4
    # Snowflake (trial, fourth engine, #185): database OLIST, schemas named as in
    # prod. Key-pair auth as OLIST_SVC (infra/snowflake); the key file stays outside
    # the repo. Cost guards: XS warehouse, 60 s auto-suspend, account resource monitor.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'OLIST_SVC') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', 'unset') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'OLIST_RUNNER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'OLIST_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'OLIST') }}"
      schema: main
      threads: 4
    # Scheduled CI on Snowflake (.github/workflows/snowflake.yml): same user, schemas
    # <DBT_CI_SCHEMA>_staging, ..._marts in OLIST, dropped after the run
    snowflake_ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'OLIST_SVC') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', 'unset') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'OLIST_RUNNER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'OLIST_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'OLIST') }}"
      schema: "{{ env_var('DBT_CI_SCHEMA', 'ci_local') }}"
      threads: 4
    # Used by sqlfluff's dbt templater: compiles without data or a DB file
    lint:
      type: duckdb
      path: ":memory:"
      schema: main
      threads: 1

# Read by Elementary's CLI (`edr report`, D38): the `elementary` schema the package's
# on-run-end hooks fill. Same warehouses and targets as above.
elementary:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/olist.duckdb') }}"
      schema: elementary
      threads: 4
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'olist-analytics-dbt-472315') }}"
      dataset: elementary
      location: EU
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      maximum_bytes_billed: 1000000000
      priority: interactive
    # Airflow's BigQuery DAG (its edr_report task); its DuckDB DAG uses `dev`
    airflow:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'olist-analytics-dbt-472315') }}"
      dataset: airflow_elementary
      location: EU
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      maximum_bytes_billed: 1000000000
      priority: interactive
