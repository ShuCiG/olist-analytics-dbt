olist:
  # Default target; DBT_TARGET picks another one for tools without a --target flag
  # (MetricFlow's `mf`: DBT_TARGET=prod uv run mf query ...)
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      # Relative to transform/ (dbt is run from there); override for Docker/CI
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/olist.duckdb') }}"
      schema: main
      threads: 4
    # BigQuery. Auth = Application Default Credentials: set
    # GOOGLE_APPLICATION_CREDENTIALS to the service-account key path (locally)
    # or let google-github-actions/auth set it (CI). No key path in the repo.
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'olist-analytics-dbt-472315') }}"
      dataset: main
      location: EU
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
    # Per-PR CI on BigQuery: datasets become <DBT_CI_SCHEMA>_staging, ..._marts
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'olist-analytics-dbt-472315') }}"
      dataset: "{{ env_var('DBT_CI_SCHEMA', 'ci_local') }}"
      location: EU
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
    # Airflow's BigQuery DAG: datasets airflow_staging, ..._marts; reads airflow_raw
    # (DBT_RAW_SCHEMA). Kept apart from prod, which GitHub Actions CD owns.
    airflow:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'olist-analytics-dbt-472315') }}"
      dataset: airflow
      location: EU
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
    # Used by sqlfluff's dbt templater: compiles without data or a DB file
    lint:
      type: duckdb
      path: ":memory:"
      schema: main
      threads: 1

# Read by Elementary's CLI (`edr report`, D38): the `elementary` schema the package's
# on-run-end hooks fill. Same warehouses and targets as above.
elementary:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/olist.duckdb') }}"
      schema: elementary
      threads: 4
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'olist-analytics-dbt-472315') }}"
      dataset: elementary
      location: EU
      threads: 8
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
