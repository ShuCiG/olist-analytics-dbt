olist:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to transform/ (dbt is run from there); override for Docker/CI
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/olist.duckdb') }}"
      schema: main
      threads: 4
    # Used by sqlfluff's dbt templater: compiles without data or a DB file
    lint:
      type: duckdb
      path: ":memory:"
      schema: main
      threads: 1
