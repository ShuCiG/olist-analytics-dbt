name: olist
version: "1.0.0"
config-version: 2
profile: olist

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

# JSON comment on every query; on BigQuery its keys become job labels (target,
# node), so INFORMATION_SCHEMA.JOBS can tell which model or test a job ran (D71).
# Other engines only see the comment.
query-comment:
  comment: "{{ query_comment(node) }}"
  job-label: true

# audit_helper (data diff, D73) looks in this project first: macros/data_diff.sql
# adds the DuckDB version of a macro the package has no DuckDB version of.
dispatch:
  - macro_namespace: audit_helper
    search_order: ["olist", "audit_helper"]

flags:
  # Future dbt default: a package's ref() looks in the package first, then in the
  # root project. dbt_project_evaluator's ref to its exceptions seed then finds
  # ours (its own copy is disabled below) without a cycle warning per rule.
  require_ref_searches_node_package_before_root: true

vars:
  # Elementary's clock (D38). Anomaly tests look back from "now"; the data is a
  # 2016-2018 dump, so "now" is the last order in the data, not the wall clock.
  # Default = the dump's last order (full loads: CI, prod); Airflow's replay passes
  # the last order of the months loaded so far (feed status `last_order_at`).
  custom_run_started_at: "{{ env_var('OLIST_AS_OF', '2018-10-17T17:30:18') }}"
  # Elementary's on-run-end re-uploads the project's artifacts (models, tests,
  # sources) after every dbt call: ~4 s of the freshness call's ~5 s hook. Every
  # freshness run here (Airflow's producer, CI, CD) sits next to a build that uploads
  # the same artifacts, so freshness only uploads its own results (D55). Per
  # command, not via `--vars`: a changed `--vars` drops dbt's partial parse (D50).
  # Elementary reads the rendered "True" / "False" as a boolean.
  disable_dbt_artifacts_autoupload: "{{ flags.WHICH == 'freshness' }}"
  # Anomaly tests on incremental models (fct_order_items) recompute every bucket of
  # the training window, as they do for tables. Otherwise Elementary computes only
  # missing buckets but scores only metrics stored after the model's last full
  # refresh: after two `--full-refresh` runs the training set shrank to 2-5 days (D68).
  force_metrics_backfill: true
  # dbt_project_evaluator lints this project's nodes, not Elementary's internal models
  exclude_packages: ["elementary"]
  # No failing-row samples in Elementary's tables or its public report (Pages): rows
  # of fct_orders carry customer_unique_id. Today dbt ignores Elementary's test
  # materialization (require_explicit_package_overrides_for_builtin_materializations
  # defaults to true), which is where samples are taken; this keeps them off if
  # that flag is ever turned off. Failure counts are stored either way.
  test_sample_row_count: 0

models:
  olist:
    staging:
      +materialized: view
      +schema: staging
      # The job history behind the cost mart, enabled with it (marts/platform below)
      bigquery:
        +enabled: &job_costs_enabled "{{ (var('job_costs', target.name in ['prod', 'lint']) | string | lower == 'true') | as_bool }}"
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      # Consumed outside the project (dashboard, other teams): groups and access in models/_groups.yml
      +access: public
      # BigQuery cost per dbt node from the job history (D71). Prod only: it reads
      # region-wide INFORMATION_SCHEMA.JOBS_BY_PROJECT, which only dbt-runner may
      # list (infra/job_history.tf); the deploy builds it in a step of its own.
      # Also on for `lint` (sqlfluff only renders it, never runs it).
      # `--vars '{job_costs: true}'` turns it on elsewhere for a check as the owner.
      platform:
        +enabled: *job_costs_enabled
        +group: platform
  # Project linter, off by default: CI runs it as its own step with
  # DBT_PROJECT_EVALUATOR=true (D32). Off, its nodes stay out of every build,
  # Airflow's manifest and the warn-test list of the alert emails.
  dbt_project_evaluator:
    +enabled: &evaluator_enabled "{{ (env_var('DBT_PROJECT_EVALUATOR', 'false') | lower == 'true') | as_bool }}"
    +schema: project_evaluator
  # Observability tables (run/test history, metrics), filled by its on-run-end hooks
  elementary:
    +schema: elementary

data_tests:
  dbt_project_evaluator:
    # Findings fail the step; known exceptions live in seeds/dbt_project_evaluator_exceptions.csv
    +severity: error

seeds:
  dbt_project_evaluator:
    # Replaced by this project's seeds/dbt_project_evaluator_exceptions.csv
    dbt_project_evaluator_exceptions:
      +enabled: false
  olist:
    +schema: seeds
    # Evaluator findings accepted on purpose, with the reason (described by the package's yml)
    dbt_project_evaluator_exceptions:
      +enabled: *evaluator_enabled
      +schema: project_evaluator
    product_category_name_translation:
      # Macros (dbt.type_string) aren't available here, `target` is
      +column_types:
        product_category_name: "{{ 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' }}"
        product_category_name_english: "{{ 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' }}"
