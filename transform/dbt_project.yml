name: olist
version: "1.0.0"
config-version: 2
profile: olist

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

flags:
  # Future dbt default: a package's ref() looks in the package first, then in the
  # root project. dbt_project_evaluator's ref to its exceptions seed then finds
  # ours (its own copy is disabled below) without a cycle warning per rule.
  require_ref_searches_node_package_before_root: true

vars:
  # Elementary's clock (D38). Anomaly tests look back from "now"; the data is a
  # 2016-2018 dump, so "now" is the last order in the data, not the wall clock.
  # Default = the dump's last order (full loads: CI, prod); Airflow's replay passes
  # the last order of the months loaded so far (feed status `last_order_at`).
  custom_run_started_at: "{{ env_var('OLIST_AS_OF', '2018-10-17T17:30:18') }}"
  # dbt_project_evaluator lints this project's nodes, not Elementary's internal models
  exclude_packages: ["elementary"]

models:
  olist:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      # Consumed outside the project (dashboard, other teams): groups and access in models/_groups.yml
      +access: public
  # Project linter, off by default: CI runs it as its own step with
  # DBT_PROJECT_EVALUATOR=true (D32). Off, its nodes stay out of every build,
  # Airflow's manifest and the warn-test list of the alert emails.
  dbt_project_evaluator:
    +enabled: &evaluator_enabled "{{ (env_var('DBT_PROJECT_EVALUATOR', 'false') | lower == 'true') | as_bool }}"
    +schema: project_evaluator
  # Observability tables (run/test history, metrics), filled by its on-run-end hooks
  elementary:
    +schema: elementary

data_tests:
  dbt_project_evaluator:
    # Findings fail the step; known exceptions live in seeds/dbt_project_evaluator_exceptions.csv
    +severity: error

seeds:
  dbt_project_evaluator:
    # Replaced by this project's seeds/dbt_project_evaluator_exceptions.csv
    dbt_project_evaluator_exceptions:
      +enabled: false
  olist:
    +schema: seeds
    # Evaluator findings accepted on purpose, with the reason (described by the package's yml)
    dbt_project_evaluator_exceptions:
      +enabled: *evaluator_enabled
      +schema: project_evaluator
    product_category_name_translation:
      # Macros (dbt.type_string) aren't available here, `target` is
      +column_types:
        product_category_name: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        product_category_name_english: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
