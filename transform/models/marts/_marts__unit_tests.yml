version: 2

unit_tests:
  - name: test_dim_customers_lifetime_value
    model: dim_customers
    description: >
      One row per person across all their orders. Canceled orders count as orders
      but not toward lifetime value; an order without payments adds 0.
    given:
      - input: ref('int_orders_joined_to_customers')
        rows:
          - {order_id: o1, customer_unique_id: u1, zip_code_prefix: '01001', city: sao paulo, state: SP,
             order_status: delivered, purchased_at: 2018-01-01 10:00:00}
          - {order_id: o2, customer_unique_id: u1, zip_code_prefix: '01001', city: sao paulo, state: SP,
             order_status: canceled, purchased_at: 2018-03-01 10:00:00}
          - {order_id: o3, customer_unique_id: u1, zip_code_prefix: '01001', city: sao paulo, state: SP,
             order_status: delivered, purchased_at: 2018-06-01 10:00:00}
          - {order_id: o4, customer_unique_id: u2, zip_code_prefix: '01001', city: sao paulo, state: SP,
             order_status: delivered, purchased_at: 2018-02-01 10:00:00}
      - input: ref('int_payments_pivoted_to_orders')
        rows:
          - {order_id: o1, total_payment_value: 100.00}
          - {order_id: o2, total_payment_value: 30.00}
          - {order_id: o3, total_payment_value: 50.00}
      - input: ref('int_zip_codes_located')
        rows:
          - {zip_code_prefix: '01001', latitude: -23.55, longitude: -46.63}
    expect:
      rows:
        - {customer_unique_id: u1, first_order_at: 2018-01-01 10:00:00, last_order_at: 2018-06-01 10:00:00,
           orders_count: 3, is_repeat_customer: true, lifetime_value: 150.00}
        - {customer_unique_id: u2, first_order_at: 2018-02-01 10:00:00, last_order_at: 2018-02-01 10:00:00,
           orders_count: 1, is_repeat_customer: false, lifetime_value: 0}

  - name: test_dim_customers_location_from_latest_order
    model: dim_customers
    description: >
      Location comes from the person's latest order (ties broken by order_id),
      not the first one. A zip missing from geolocation keeps the row with null coordinates.
    given:
      - input: ref('int_orders_joined_to_customers')
        rows:
          - {order_id: o1, customer_unique_id: u1, zip_code_prefix: '01001', city: sao paulo, state: SP,
             order_status: delivered, purchased_at: 2018-01-01 10:00:00}
          - {order_id: o2, customer_unique_id: u1, zip_code_prefix: '20000', city: rio de janeiro, state: RJ,
             order_status: delivered, purchased_at: 2018-06-01 10:00:00}
          # same timestamp: order_id 'o3' < 'o4' wins
          - {order_id: o3, customer_unique_id: u2, zip_code_prefix: '99999', city: nowhere, state: AC,
             order_status: delivered, purchased_at: 2018-05-01 10:00:00}
          - {order_id: o4, customer_unique_id: u2, zip_code_prefix: '01001', city: sao paulo, state: SP,
             order_status: delivered, purchased_at: 2018-05-01 10:00:00}
      - input: ref('int_payments_pivoted_to_orders')
        rows: []
      - input: ref('int_zip_codes_located')
        rows:
          - {zip_code_prefix: '01001', latitude: -23.55, longitude: -46.63}
          - {zip_code_prefix: '20000', latitude: -22.91, longitude: -43.17}
    expect:
      rows:
        - {customer_unique_id: u1, zip_code_prefix: '20000', city: rio de janeiro, state: RJ,
           latitude: -22.91, longitude: -43.17}
        - {customer_unique_id: u2, zip_code_prefix: '99999', city: nowhere, state: AC,
           latitude: null, longitude: null}

  - name: test_fct_order_items_incremental_picks_new_loads
    model: fct_order_items
    description: >
      Incremental run: only items loaded at/after the max `_loaded_at` already in
      the table (2026-01-15), together with their order, are processed. i1 is old
      (skipped), i2 is a new item. i3 is an old item whose order was reloaded alone
      (status change): skipped too. The loader never does that (an order and its
      items load in one chunk, assert_order_items_loaded_with_their_order); the
      filter per table relies on it so BigQuery can prune partitions (D70).
    overrides:
      macros:
        is_incremental: true
    given:
      # SQL fixture: a dict fixture for `this` makes dbt introspect the existing
      # table, which fails on a fresh CI database (and lacks newly added columns).
      # Fixtures are not Jinja-rendered with macros, hence a plain cross-DB cast.
      - input: this
        format: sql
        rows: |
          select
            'i0' as order_item_sk,
            cast('2026-01-15 00:00:00' as timestamp) as _loaded_at  -- valid on DuckDB and BigQuery
      - input: ref('stg_olist__order_items')
        rows:
          - {order_item_sk: i1, order_id: o1, price: 10, freight_value: 1, _loaded_at: 2026-01-01 00:00:00}
          - {order_item_sk: i2, order_id: o2, price: 20, freight_value: 2, _loaded_at: 2026-02-01 00:00:00}
          - {order_item_sk: i3, order_id: o3, price: 30, freight_value: 3, _loaded_at: 2026-01-01 00:00:00}
      - input: ref('int_orders_joined_to_customers')
        rows:
          - {order_id: o1, customer_unique_id: u1, order_status: delivered, _loaded_at: 2026-01-01 00:00:00}
          - {order_id: o2, customer_unique_id: u1, order_status: delivered, _loaded_at: 2026-02-01 00:00:00}
          - {order_id: o3, customer_unique_id: u1, order_status: canceled, _loaded_at: 2026-02-01 00:00:00}
    expect:
      rows:
        - {order_item_sk: i2, order_status: delivered, item_amount: 22.00, _loaded_at: 2026-02-01 00:00:00}

  - name: test_dim_sellers_history_validity_ranges
    model: dim_sellers_history
    description: >
      Versions are numbered per seller in snapshot order. The first version is valid
      from 1900-01-01 (orders older than the snapshot still find it), later ones from
      their snapshot time; the open version ends at 9999-12-31 and is current, also
      when it records a deletion.
    given:
      - input: ref('snap_sellers')
        rows:
          - {dbt_scd_id: v1, seller_id: s1, seller_zip_code_prefix: '01001', seller_city: sao paulo,
             seller_state: SP, dbt_valid_from: 2026-01-01 00:00:00, dbt_valid_to: 2026-02-01 00:00:00,
             dbt_is_deleted: 'False'}
          - {dbt_scd_id: v2, seller_id: s1, seller_zip_code_prefix: '20000', seller_city: rio de janeiro,
             seller_state: RJ, dbt_valid_from: 2026-02-01 00:00:00, dbt_valid_to: 2026-03-01 00:00:00,
             dbt_is_deleted: 'False'}
          - {dbt_scd_id: v3, seller_id: s1, seller_zip_code_prefix: '20000', seller_city: rio de janeiro,
             seller_state: RJ, dbt_valid_from: 2026-03-01 00:00:00, dbt_valid_to: null,
             dbt_is_deleted: 'True'}
          - {dbt_scd_id: w1, seller_id: s2, seller_zip_code_prefix: '01001', seller_city: sao paulo,
             seller_state: SP, dbt_valid_from: 2026-01-01 00:00:00, dbt_valid_to: null,
             dbt_is_deleted: 'False'}
      - input: ref('int_zip_codes_located')
        rows:
          - {zip_code_prefix: '01001', latitude: -23.55, longitude: -46.63}
    expect:
      rows:
        - {seller_version_id: v1, version_number: 1, state: SP, latitude: -23.55,
           valid_from: 1900-01-01 00:00:00, valid_to: 2026-02-01 00:00:00, is_current: false, is_deleted: false}
        - {seller_version_id: v2, version_number: 2, state: RJ, latitude: null,
           valid_from: 2026-02-01 00:00:00, valid_to: 2026-03-01 00:00:00, is_current: false, is_deleted: false}
        - {seller_version_id: v3, version_number: 3, state: RJ, latitude: null,
           valid_from: 2026-03-01 00:00:00, valid_to: 9999-12-31 00:00:00, is_current: true, is_deleted: true}
        - {seller_version_id: w1, version_number: 1, state: SP, latitude: -23.55,
           valid_from: 1900-01-01 00:00:00, valid_to: 9999-12-31 00:00:00, is_current: true, is_deleted: false}

  - name: test_fct_order_items_seller_as_of_point_in_time
    model: fct_order_items_seller_as_of
    description: >
      Each item gets the seller version whose [valid_from, valid_to) holds the
      purchase: an old order gets the first version although the seller moved later,
      a purchase at the exact moment of a change gets the new version (half-open
      ranges, no double match), a purchase after a deletion gets the deletion version.
    given:
      - input: ref('fct_order_items')
        rows:
          - {order_item_sk: i1, seller_id: s1, purchased_at: 2017-05-01 10:00:00}
          - {order_item_sk: i2, seller_id: s1, purchased_at: 2026-02-01 00:00:00}
          - {order_item_sk: i3, seller_id: s1, purchased_at: 2026-04-01 10:00:00}
          - {order_item_sk: i4, seller_id: s2, purchased_at: 2017-05-01 10:00:00}
      - input: ref('dim_sellers_history')
        rows:
          - {seller_version_id: v1, seller_id: s1, state: SP, is_current: false,
             valid_from: 1900-01-01 00:00:00, valid_to: 2026-02-01 00:00:00}
          - {seller_version_id: v2, seller_id: s1, state: RJ, is_current: false,
             valid_from: 2026-02-01 00:00:00, valid_to: 2026-03-01 00:00:00}
          - {seller_version_id: v3, seller_id: s1, state: RJ, is_current: true,
             valid_from: 2026-03-01 00:00:00, valid_to: 9999-12-31 00:00:00}
          - {seller_version_id: w1, seller_id: s2, state: SP, is_current: true,
             valid_from: 1900-01-01 00:00:00, valid_to: 9999-12-31 00:00:00}
    expect:
      rows:
        - {order_item_sk: i1, seller_version_id: v1, seller_state: SP, is_seller_version_current: false}
        - {order_item_sk: i2, seller_version_id: v2, seller_state: RJ, is_seller_version_current: false}
        - {order_item_sk: i3, seller_version_id: v3, seller_state: RJ, is_seller_version_current: true}
        - {order_item_sk: i4, seller_version_id: w1, seller_state: SP, is_seller_version_current: true}

  - name: test_fct_customer_cohorts_retention_and_ltv
    model: fct_customer_cohorts
    description: >
      Cohort = month of the first order: an order on the last evening of January
      is the January cohort, one a few hours later counts as month 1. A canceled
      order counts as activity but adds no revenue. A month nobody ordered in is a
      row with zeros (cumulative values carry on); months after the latest order
      (April) get no rows.
    given:
      - input: ref('dim_customers')
        rows:
          - {customer_unique_id: u1, first_order_at: 2018-01-31 23:00:00}
          - {customer_unique_id: u2, first_order_at: 2018-01-15 10:00:00}
          - {customer_unique_id: u3, first_order_at: 2018-02-10 10:00:00}
      - input: ref('fct_orders')
        rows:
          - {customer_unique_id: u1, order_status: delivered, paid_amount: 100.00, purchased_at: 2018-01-31 23:00:00}
          - {customer_unique_id: u1, order_status: canceled, paid_amount: 30.00, purchased_at: 2018-02-01 01:00:00}
          - {customer_unique_id: u1, order_status: delivered, paid_amount: 50.00, purchased_at: 2018-03-05 10:00:00}
          - {customer_unique_id: u2, order_status: delivered, paid_amount: 20.00, purchased_at: 2018-01-15 10:00:00}
          - {customer_unique_id: u3, order_status: delivered, paid_amount: 40.00, purchased_at: 2018-02-10 10:00:00}
      - input: ref('dim_date')
        rows:
          # one row per day in the real model: months repeat
          - {month_start_date: 2018-01-01}
          - {month_start_date: 2018-01-01}
          - {month_start_date: 2018-02-01}
          - {month_start_date: 2018-03-01}
          - {month_start_date: 2018-04-01}
    expect:
      rows:
        - {cohort_month: 2018-01-01, months_since_first_order: 0, activity_month: 2018-01-01, cohort_size: 2,
           active_customers: 2, retention_rate: 1.0, orders_count: 2, revenue: 120.00,
           cumulative_revenue: 120.00, cumulative_revenue_per_customer: 60.00}
        - {cohort_month: 2018-01-01, months_since_first_order: 1, activity_month: 2018-02-01, cohort_size: 2,
           active_customers: 1, retention_rate: 0.5, orders_count: 1, revenue: 0,
           cumulative_revenue: 120.00, cumulative_revenue_per_customer: 60.00}
        - {cohort_month: 2018-01-01, months_since_first_order: 2, activity_month: 2018-03-01, cohort_size: 2,
           active_customers: 1, retention_rate: 0.5, orders_count: 1, revenue: 50.00,
           cumulative_revenue: 170.00, cumulative_revenue_per_customer: 85.00}
        - {cohort_month: 2018-02-01, months_since_first_order: 0, activity_month: 2018-02-01, cohort_size: 1,
           active_customers: 1, retention_rate: 1.0, orders_count: 1, revenue: 40.00,
           cumulative_revenue: 40.00, cumulative_revenue_per_customer: 40.00}
        - {cohort_month: 2018-02-01, months_since_first_order: 1, activity_month: 2018-03-01, cohort_size: 1,
           active_customers: 0, retention_rate: 0, orders_count: 0, revenue: 0,
           cumulative_revenue: 40.00, cumulative_revenue_per_customer: 40.00}
