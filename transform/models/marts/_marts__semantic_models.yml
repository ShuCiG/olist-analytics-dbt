version: 2

# dbt Semantic Layer (MetricFlow, D35, D99). Business metrics are defined once, in
# _marts__models.yml, next to their marts (`semantic_model`, `metrics`; `entity` and
# `dimension` on the columns). `mf query` turns a metric + dimensions into SQL for
# the current target (DuckDB or BigQuery), joins included. The dashboard keeps its
# own SQL, and its KPIs are checked against these definitions
# (dashboard/tests/test_metrics.py). The time spine is dim_date (`time_spine`).
#
#   cd transform && uv run dbt parse && uv run mf query --metrics revenue --group-by metric_time__month

# Named queries over the metrics: `mf query --saved-query <name>`
saved_queries:
  - name: sales_by_month
    description: Monthly sales KPIs (Sales overview page).
    query_params:
      metrics: [orders, revenue, average_order_value, customers]
      group_by:
        - TimeDimension('metric_time', 'month')
    config:
      group: orders

  - name: late_delivery_by_state
    description: Late deliveries by the customer's state (Delivery page), via the order → customer join.
    query_params:
      metrics: [delivered_orders, late_delivery_rate, avg_days_to_deliver]
      group_by:
        - Dimension('customer__state')
    config:
      group: orders

  - name: order_funnel_by_month
    description: Median time per order stage and the share of orders stuck in each stage, by purchase month.
    query_params:
      metrics:
        - median_hours_to_approve
        - median_days_approved_to_carrier
        - median_days_carrier_to_customer
        - median_days_delivered_to_review
        - awaiting_approval_rate
        - awaiting_shipping_rate
        - in_transit_rate
      group_by:
        - TimeDimension('metric_time', 'month')
    config:
      group: orders

  - name: cohort_retention_curve
    description: Retention and revenue per acquired person by month since the first order, over all cohorts (Customers page).
    query_params:
      metrics: [cohort_size, retained_customers, cohort_retention_rate]
      group_by:
        - Dimension('cohort__months_since_first_order')
    config:
      group: parties
