version: 2

# Contracts: data types use names both DuckDB and BigQuery accept (string, bigint,
# integer, boolean, date, timestamp). Money and float types differ per adapter:
# YAML anchors &money_type / &float_type (first use below) switch on target.type.
# Money columns are cast explicitly with to_money(): DuckDB checks decimal precision,
# so numeric(18, 2) there. BigQuery forbids parameterized types in CAST (contracts
# cast), so plain NUMERIC + round(x, 2); dbt warns "unspecified precision/scale" on
# every BigQuery build — expected (D24).
# primary_key: DuckDB enforces it; BigQuery only records it (warn_unenforced: false),
# the unique + not_null tests check it there.

models:
  - name: dim_date
    description: Calendar dimension 2016-2019 (dbt_date). No contract — columns are generated by the package.
    # Protected, not public: public models must have contracts (dbt_project_evaluator)
    config:
      group: orders
      access: protected
    columns:
      - name: date_day
        description: Primary key.
        data_tests: [unique, not_null]

  - name: dim_customers
    description: >
      One row per person (`customer_unique_id`). Location from the latest order.
      `lifetime_value` = payments on orders not canceled/unavailable.
    config:
      group: parties
      contract:
        enforced: true
    columns:
      - name: customer_unique_id
        description: "{{ doc('customer_unique_id') }} Primary key."
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - name: zip_code_prefix
        description: "{{ doc('zip_code_prefix') }} From the latest order."
        data_type: string
      - name: city
        description: City of the latest order.
        data_type: string
      - name: state
        description: Two-letter state code of the latest order.
        data_type: string
      - name: latitude
        description: "{{ doc('latitude') }}"
        data_type: &float_type "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
      - name: longitude
        description: "{{ doc('longitude') }}"
        data_type: *float_type
      - name: first_order_at
        description: Purchase timestamp of the first order.
        data_type: timestamp
      - name: last_order_at
        description: Purchase timestamp of the latest order.
        data_type: timestamp
        data_tests:
          - is_not_before:
              arguments:
                earlier_column: first_order_at
      - name: orders_count
        description: Number of orders, all statuses.
        data_type: bigint
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: is_repeat_customer
        description: True if the person placed more than one order.
        data_type: boolean
      - name: lifetime_value
        description: Sum of payments on orders that are not canceled/unavailable, in BRL.
        data_type: &money_type "{{ 'numeric' if target.type == 'bigquery' else 'numeric(18, 2)' }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  - name: dim_sellers
    description: One row per seller with zip-prefix centroid coordinates.
    config:
      group: parties
      contract:
        enforced: true
    columns:
      - name: seller_id
        description: Primary key.
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - name: zip_code_prefix
        description: "{{ doc('zip_code_prefix') }}"
        data_type: string
      - name: city
        description: Seller city.
        data_type: string
      - name: state
        description: Two-letter state code.
        data_type: string
      - name: latitude
        description: "{{ doc('latitude') }}"
        data_type: *float_type
      - name: longitude
        description: "{{ doc('longitude') }}"
        data_type: *float_type

  - name: dim_products
    description: One row per product; category translated to English ('unknown' if missing).
    config:
      group: orders
      contract:
        enforced: true
    columns:
      - name: product_id
        description: Primary key.
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - name: category_name_pt
        description: Original Portuguese category name (null if missing in source).
        data_type: string
      - name: category_name
        description: English category name; falls back to the Portuguese name, then 'unknown'.
        data_type: string
        data_tests: [not_null]
      - name: name_length
        description: Length of the product name, in characters.
        data_type: integer
      - name: description_length
        description: Length of the product description, in characters.
        data_type: integer
      - name: photos_qty
        description: Number of published product photos.
        data_type: integer
      - name: weight_g
        description: Weight, grams.
        data_type: integer
      - name: length_cm
        description: Length, cm.
        data_type: integer
      - name: height_cm
        description: Height, cm.
        data_type: integer
      - name: width_cm
        description: Width, cm.
        data_type: integer
      - name: volume_cm3
        description: length × height × width, cm³.
        data_type: integer

  - name: fct_orders
    description: >
      One row per order with item, payment, delivery and review measures.
      `order_amount` = items + freight; `paid_amount` = what was paid (can differ: installment fees, vouchers).
    config:
      group: orders
      contract:
        enforced: true
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: ref('stg_olist__orders')
    # Shared by both versions. Columns with data tests are anchored (&x_col) and
    # extended with their tests in version 2 below.
    columns:
      - name: order_id
        description: "{{ doc('order_id') }} Primary key."
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - &customer_unique_id_col
        name: customer_unique_id
        description: "{{ doc('customer_unique_id') }}"
        data_type: string
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_type: string
      - &purchase_date_col
        name: purchase_date
        description: "{{ doc('purchase_date') }}"
        data_type: date
      - name: purchased_at
        description: Purchase timestamp.
        data_type: timestamp
      - &approved_at_col
        name: approved_at
        description: Payment approval timestamp.
        data_type: timestamp
      - &delivered_to_carrier_at_col
        name: delivered_to_carrier_at
        description: Handed over to the logistics partner.
        data_type: timestamp
      - &delivered_to_customer_at_col
        name: delivered_to_customer_at
        description: Delivered to the customer.
        data_type: timestamp
      - name: estimated_delivery_date
        description: Delivery date promised to the customer at purchase.
        data_type: date
      - name: items_count
        description: Number of line items (0 if the order has none).
        data_type: bigint
      - name: distinct_sellers_count
        description: Number of distinct sellers in the order.
        data_type: bigint
      - name: items_amount
        description: Sum of item prices, BRL.
        data_type: *money_type
      - name: freight_amount
        description: Sum of freight, BRL.
        data_type: *money_type
      - name: order_amount
        description: "{{ doc('order_amount') }}"
        data_type: *money_type
      - name: payments_count
        description: Number of payment records.
        data_type: bigint
      - name: paid_amount
        description: "{{ doc('paid_amount') }}"
        data_type: *money_type
      - name: max_installments
        description: Largest installment count among the order's payments.
        data_type: integer
      - name: credit_card_amount
        description: Paid by credit card, BRL.
        data_type: *money_type
      - name: boleto_amount
        description: Paid by boleto (bank slip), BRL.
        data_type: *money_type
      - name: voucher_amount
        description: Paid by voucher, BRL.
        data_type: *money_type
      - name: debit_card_amount
        description: Paid by debit card, BRL.
        data_type: *money_type
      - name: hours_to_approve
        description: Hours from purchase to approval (boundary count).
        data_type: bigint
      - name: days_to_deliver
        description: Days from purchase to delivery; null if not delivered.
        data_type: bigint
      - name: days_delivered_before_estimate
        description: Estimated date − delivery date, days; negative = late.
        data_type: bigint
      - name: is_delivered
        description: True if a delivery timestamp exists.
        data_type: boolean
      - name: is_delivered_late
        description: Delivered after the estimated date (date comparison); false if not delivered.
        data_type: boolean
      - &review_score_col
        name: review_score
        description: Score of the latest review, 1–5; null if no review.
        data_type: integer
      - name: has_review
        description: True if the order has at least one review.
        data_type: boolean
    # Model versions (D33): `ref('fct_orders')` resolves to latest_version, a consumer
    # pins one with `ref('fct_orders', v=1)`. The latest version keeps the unsuffixed
    # table name (alias) the dashboard reads; v1 is the table fct_orders_v1.
    latest_version: 2
    versions:
      - v: 2
        config:
          alias: fct_orders
        # Data tests run once, here. v1 is a projection of v2: it inherits the
        # contract and the primary-key tests, nothing else (no duplicate warnings).
        # `<<: *x_col` = the shared column above plus this version's tests.
        columns:
          - include: all
          - <<: *customer_unique_id_col
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('dim_customers')
                    field: customer_unique_id
          - <<: *purchase_date_col
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('dim_date')
                    field: date_day
          - <<: *approved_at_col
            data_tests:
              - is_not_before:
                  arguments:
                    earlier_column: purchased_at
          - <<: *delivered_to_carrier_at_col
            data_tests:
              - is_not_before:
                  description: >-
                    Orders handed to the carrier before the payment was approved. The
                    approval-to-shipping time (seller handling KPI) is understated, even
                    negative, for them. Known in Olist (1,359 orders, approval likely recorded
                    late); a sharp rise means sellers ship unpaid orders or timestamps broke.
                  arguments:
                    earlier_column: approved_at
                  config:
                    severity: warn
                    meta: {alert_unit: orders}
              - is_not_before:
                  description: >-
                    Orders handed to the carrier before the customer placed them, which is
                    impossible. Shipping-time KPIs for these orders are wrong. Known source
                    defect (166 orders); report a rise to the source system owner.
                  arguments:
                    earlier_column: purchased_at
                  config:
                    severity: warn
                    meta: {alert_unit: orders}
          - <<: *delivered_to_customer_at_col
            data_tests:
              - is_not_before:
                  arguments:
                    earlier_column: purchased_at
              - is_not_before:
                  description: >-
                    Orders delivered to the customer before the carrier picked them up, which
                    is impossible. Their carrier transit time is negative, so the average
                    transit time is understated. Known source defect (23 orders).
                  arguments:
                    earlier_column: delivered_to_carrier_at
                  config:
                    severity: warn
                    meta: {alert_unit: orders}
          - <<: *review_score_col
            data_tests:
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5]
                    quote: false
      - v: 1
        deprecation_date: 2026-12-31T00:00:00Z
        description: >
          Deprecated, use the latest version. Same rows as v2, with `paid_amount`
          under its v1 name `payment_value`.
        columns:
          - include: all
            exclude: [paid_amount]
          - name: payment_value
            description: "{{ doc('paid_amount') }}"
            data_type: *money_type

  - name: fct_order_items
    description: >
      One row per order line item. Incremental (merge on `order_item_sk`): a run
      processes only items whose raw item or order row was loaded since the last run.
    config:
      group: orders
      contract:
        enforced: true
    columns:
      - name: order_item_sk
        description: Surrogate key (order_id, order_item_number). Primary key.
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: order_item_number
        description: Line number within the order, from 1.
        data_type: integer
      - name: product_id
        description: Product of the line.
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        description: Seller of the line.
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: customer_unique_id
        description: "{{ doc('customer_unique_id') }}"
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_type: string
      - name: purchase_date
        description: "{{ doc('purchase_date') }}"
        data_type: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: purchased_at
        description: Purchase timestamp of the order.
        data_type: timestamp
      - name: shipping_limit_at
        description: Deadline for the seller to hand the item to the carrier.
        data_type: timestamp
        data_tests:
          - is_not_before:
              arguments:
                earlier_column: purchased_at
      - name: price
        description: Item price, BRL.
        data_type: *money_type
      - name: freight_value
        description: Freight allocated to the item, BRL.
        data_type: *money_type
      - name: item_amount
        description: price + freight_value, BRL.
        data_type: *money_type
      - name: _loaded_at
        description: "{{ doc('loaded_at') }} Latest of the item's and its order's raw load; incremental cursor."
        data_type: "{{ 'timestamp' if target.type == 'bigquery' else 'timestamp with time zone' }}"
        data_tests: [not_null]
