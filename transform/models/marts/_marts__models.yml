version: 2

# Contracts: data types use names both DuckDB and BigQuery accept (string, bigint,
# integer, boolean, date, timestamp). Money and float types differ per adapter:
# YAML anchors &money_type / &float_type (first use below) switch on target.type.
# Money columns are cast explicitly with to_money(): DuckDB checks decimal precision,
# so numeric(18, 2) there. BigQuery forbids parameterized types in CAST (contracts
# cast), so plain NUMERIC + round(x, 2); dbt warns "unspecified precision/scale" on
# every BigQuery build — expected (D24).
# primary_key: DuckDB enforces it; BigQuery only records it (warn_unenforced: false),
# the unique + not_null tests check it there.
# Semantic layer (D99): `dimension: {type: time}`, not the short `dimension: time`,
# with which dbt-core drops `granularity` and MetricFlow fails.

models:
  - name: dim_date
    description: Calendar dimension 2016-2019 (dbt_date). No contract — columns are generated by the package.
    # Protected, not public: public models must have contracts (dbt_project_evaluator)
    config:
      group: orders
      access: protected
    # Day-grain time spine of the semantic layer (semantic_model on the marts below):
    # MetricFlow joins to it for time grains and cumulative / offset metrics
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Primary key.
        granularity: day
        data_tests: [unique, not_null]
      - name: week_of_year
        description: >
          Week of the year, weeks starting on Sunday; days before the year's first
          Sunday are week 0 (BigQuery `EXTRACT(WEEK)`, same on every engine via
          `macros/week_of_year.sql`). ISO weeks: `iso_week_of_year`.
      - name: prior_year_week_of_year
        description: "`week_of_year` of the same day of week one year earlier (364 days back)."

  - name: dim_customers
    description: >
      One row per person (`customer_unique_id`). Location from the latest order.
      `lifetime_value` = payments on orders not canceled/unavailable.
    config:
      group: parties
      contract:
        enforced: true
    columns:
      - name: customer_unique_id
        description: "{{ doc('customer_unique_id') }} Primary key."
        data_type: string
        policy_tags: ["{{ var('pii_policy_tags')['person_id'] }}"]
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
        entity: {name: customer, type: primary}
      - name: customer_key
        description: "Pseudonym of the person: SHA-256 of a secret key and `customer_unique_id`, the same in every mart. Untagged: readers without access to the id (the dashboard) count and join people on it (D94)."
        data_type: string
        data_tests: [unique, not_null]
      - name: zip_code_prefix
        description: "{{ doc('zip_code_prefix') }} From the latest order."
        data_type: string
        policy_tags: ["{{ var('pii_policy_tags')['person_location'] }}"]
      - name: city
        description: City of the latest order.
        data_type: string
        policy_tags: ["{{ var('pii_policy_tags')['person_location'] }}"]
      - name: state
        description: Two-letter state code of the latest order.
        data_type: string
        dimension: categorical
      - name: latitude
        description: "{{ doc('latitude') }}"
        data_type: &float_type "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
        policy_tags: ["{{ var('pii_policy_tags')['person_location'] }}"]
      - name: longitude
        description: "{{ doc('longitude') }}"
        data_type: *float_type
        policy_tags: ["{{ var('pii_policy_tags')['person_location'] }}"]
      - name: first_order_at
        description: Purchase timestamp of the first order.
        data_type: timestamp
        dimension: {type: time}
        granularity: day
      - name: last_order_at
        description: Purchase timestamp of the latest order.
        data_type: timestamp
        data_tests:
          - is_not_before:
              arguments:
                earlier_column: first_order_at
      - name: orders_count
        description: Number of orders, all statuses.
        data_type: bigint
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: is_repeat_customer
        description: True if the person placed more than one order.
        data_type: boolean
        dimension: categorical
      - name: lifetime_value
        description: Sum of payments on orders that are not canceled/unavailable, in BRL.
        data_type: &money_type "{{ 'numeric' if target.type == 'bigquery' else 'numeric(18, 2)' }}"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
    semantic_model:
      enabled: true
      name: customers
      group: parties
    agg_time_dimension: first_order_at
    metrics:
      - name: new_customers
        label: New customers
        description: People whose first order falls in the period.
        agg: count
        expr: customer_unique_id
        config: {group: parties}
      - name: repeat_customers
        label: Repeat customers
        description: New customers of the period who ordered more than once (ever).
        agg: count
        expr: customer_unique_id
        filter: |
          {{ Dimension('customer__is_repeat_customer') }} = true
        config: {group: parties}
      - name: repeat_customer_rate
        label: Repeat customer rate
        description: Share of new customers who came back for another order. Without a time filter = all customers.
        type: ratio
        numerator: repeat_customers
        denominator: new_customers
        config: {group: parties}

  - name: dim_customer_rfm
    description: >
      RFM segmentation, one row per person (`customer_unique_id`), from dim_customers.
      The project's one Python model (D81): built on Databricks (serverless job) and
      DuckDB, disabled on BigQuery. Recency is counted back from the last order in
      the data (`as_of_date`), not today. R and M are quintile scores (1-5, ties
      share a score); F is the order count capped at 5, because ~97% of people
      order once.
    # Protected, not public: dbt has no contracts for Python models, and public
    # models must have one (dbt_project_evaluator). Not part of the data product.
    config:
      group: parties
      access: protected
      enabled: "{{ target.type in ['databricks', 'duckdb'] }}"
      # Databricks: run the model as a one-off job on serverless compute; the SQL
      # warehouse can't run Python. Other adapters ignore it.
      submission_method: serverless_cluster
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('dim_customers')
    columns:
      - name: customer_unique_id
        description: "{{ doc('customer_unique_id') }} Primary key."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: recency_days
        description: Days from the person's latest order to `as_of_date`.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: orders_count
        description: Number of orders, all statuses (as in dim_customers).
      - name: lifetime_value
        description: As in dim_customers, in BRL.
      - name: recency_score
        description: 1-5, 5 = most recent fifth of people.
        data_tests: &rfm_score_tests
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: frequency_score
        description: Order count capped at 5.
        data_tests: *rfm_score_tests
      - name: monetary_score
        description: 1-5, 5 = top fifth by lifetime value.
        data_tests: *rfm_score_tests
      - name: rfm_score
        description: The three scores as one code, e.g. `515`.
      - name: segment
        description: >
          Repeat buyers (F >= 2): `champions` (R >= 4) or `loyal_at_risk`. One-time
          buyers: `new_big_spenders` / `new_customers` (R >= 4, M >= 4 or not),
          `big_spenders_at_risk` / `hibernating` (R 2-3), `lost` (R = 1).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - champions
                  - loyal_at_risk
                  - new_big_spenders
                  - new_customers
                  - big_spenders_at_risk
                  - hibernating
                  - lost
      - name: as_of_date
        description: Date of the last order in the data, the "today" of recency.

  - name: fct_customer_cohorts
    description: >
      Retention and value of acquisition cohorts. One row per cohort (month of a
      person's first order) and month since that first order, from month 0 up to
      the latest month with orders; months nobody ordered in are rows with zeros.
      Active = placed any order that month (all statuses, as `orders_count` in
      `dim_customers`); revenue = payments on orders not canceled/unavailable (as
      `lifetime_value`). The latest month is partial while the feed runs.
    config:
      group: parties
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cohort_month, months_since_first_order]
    columns:
      - name: cohort_month_sk
        description: Surrogate key (cohort_month, months_since_first_order). Primary key.
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
        entity: {name: cohort, type: primary}
      - name: cohort_month
        description: First day of the month of the cohort's first orders.
        data_type: date
        dimension: {type: time}
        granularity: month
        data_tests: [not_null]
      - name: months_since_first_order
        description: Calendar months between `cohort_month` and `activity_month`; 0 = the month of the first order.
        data_type: integer
        dimension: categorical
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: activity_month
        description: First day of the month the activity is counted in.
        data_type: date
        data_tests:
          - not_null
          - is_not_before:
              arguments:
                earlier_column: cohort_month
      - name: cohort_size
        description: People whose first order is in `cohort_month`.
        data_type: bigint
      - name: active_customers
        description: People of the cohort who placed at least one order in `activity_month`.
        data_type: bigint
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= cohort_size"
      - name: retention_rate
        description: "`active_customers` / `cohort_size`; 1 in month 0."
        data_type: *float_type
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: orders_count
        description: Orders of the cohort in `activity_month`, all statuses.
        data_type: bigint
      - name: revenue
        description: Payments of the cohort in `activity_month` on orders not canceled/unavailable, in BRL.
        data_type: *money_type
      - name: cumulative_revenue
        description: "`revenue` from month 0 up to this month, in BRL."
        data_type: *money_type
      - name: cumulative_revenue_per_customer
        description: >
          `cumulative_revenue` / `cohort_size`: value per acquired person after this
          many months (LTV curve), in BRL.
        data_type: *money_type
    semantic_model:
      enabled: true
      name: customer_cohorts
      group: parties
    agg_time_dimension: cohort_month
    metrics:
      # Sums over cohorts weight each by its size.
      - name: cohort_size
        label: Cohort size
        description: People acquired; with a `months_since_first_order` filter, only cohorts old enough to have that month.
        agg: sum
        expr: cohort_size
        config: {group: parties}
      - name: retained_customers
        label: Retained customers
        description: People who ordered again in a given month after their first (group by months since first order).
        agg: sum
        expr: active_customers
        config: {group: parties}
      - name: cohort_retention_rate
        label: Cohort retention rate
        description: >
          Retained customers / cohort size, per month since the first order (1 in
          month 0). Without that dimension it averages over all months: group by it.
        type: ratio
        numerator: retained_customers
        denominator: cohort_size
        config: {group: parties}
      - name: ltv_3_months
        label: 3-month LTV, BRL
        description: >
          Revenue per acquired person in the calendar month of the first order and the
          two after (months 0-2). Cohorts younger than that are left out.
        type: ratio
        numerator:
          name: cohort_revenue_to_date
          filter: &month_2 |
            {{ Dimension('cohort__months_since_first_order') }} = 2
        denominator:
          name: cohort_size
          filter: *month_2
        config: {group: parties}
      - name: cohort_revenue_to_date
        label: Cohort revenue to date, BRL
        description: Cumulative revenue of the cohorts up to a month since the first order (filter or group by that month).
        agg: sum
        expr: cumulative_revenue
        config: {group: parties}

  - name: dim_sellers
    description: One row per seller with zip-prefix centroid coordinates.
    config:
      group: parties
      contract:
        enforced: true
    columns:
      - name: seller_id
        description: Primary key.
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - name: zip_code_prefix
        description: "{{ doc('zip_code_prefix') }}"
        data_type: string
      - name: city
        description: Seller city.
        data_type: string
      - name: state
        description: Two-letter state code.
        data_type: string
      - name: latitude
        description: "{{ doc('latitude') }}"
        data_type: *float_type
      - name: longitude
        description: "{{ doc('longitude') }}"
        data_type: *float_type

  - name: dim_sellers_history
    description: >
      One row per seller version (SCD2, from snapshot `snap_sellers`): a new version
      opens when the seller's zip, city or state changes, or when the seller disappears
      from the source (`is_deleted`). Ranges [valid_from, valid_to) are half-open and,
      per seller, contiguous; the first version starts at 1900-01-01 and the open one
      ends at 9999-12-31, so a join on any business timestamp finds exactly one version.
      Version boundaries are snapshot run times (`recorded_at`), not the time of the
      real change. `dim_sellers` is the current state only.
    config:
      group: parties
      contract:
        enforced: true
    data_tests:
      # Per seller: no overlaps and no gaps between versions
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: valid_from
            upper_bound_column: valid_to
            partition_by: seller_id
            gaps: not_allowed
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [seller_id, version_number]
    columns:
      - name: seller_version_id
        description: Version key (the snapshot's dbt_scd_id). Primary key.
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - name: seller_id
        description: "Seller key; not unique here, one row per version."
        data_type: string
        data_tests:
          - not_null
          # Exactly one open version per seller
          - unique:
              config:
                where: is_current
      - name: version_number
        description: 1 for the seller's first version, then +1 per change.
        data_type: integer
        data_tests: [not_null]
      - name: zip_code_prefix
        description: "{{ doc('zip_code_prefix') }}"
        data_type: string
      - name: city
        description: Seller city in this version.
        data_type: string
      - name: state
        description: Two-letter state code in this version.
        data_type: string
      - name: latitude
        description: "{{ doc('latitude') }}"
        data_type: *float_type
      - name: longitude
        description: "{{ doc('longitude') }}"
        data_type: *float_type
      - name: valid_from
        description: Start of the version, inclusive; 1900-01-01 for the first version.
        data_type: timestamp
        data_tests: [not_null]
      - name: valid_to
        description: End of the version, exclusive; 9999-12-31 for the open version.
        data_type: timestamp
        data_tests:
          - not_null
          - is_not_before:
              arguments:
                earlier_column: valid_from
      - name: is_current
        description: True for the seller's latest version (also when that version records a deletion).
        data_type: boolean
        data_tests: [not_null]
      - name: is_deleted
        description: True on the version that records the seller disappearing from the source.
        data_type: boolean
        data_tests: [not_null]
      - name: recorded_at
        description: When the snapshot captured this version (its dbt_valid_from).
        data_type: timestamp
        data_tests: [not_null]

  - name: dim_products
    description: One row per product; category translated to English ('unknown' if missing).
    config:
      group: orders
      contract:
        enforced: true
    columns:
      - name: product_id
        description: Primary key.
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - name: category_name_pt
        description: Original Portuguese category name (null if missing in source).
        data_type: string
      - name: category_name
        description: English category name; falls back to the Portuguese name, then 'unknown'.
        data_type: string
        data_tests: [not_null]
      - name: name_length
        description: Length of the product name, in characters.
        data_type: integer
      - name: description_length
        description: Length of the product description, in characters.
        data_type: integer
      - name: photos_qty
        description: Number of published product photos.
        data_type: integer
      - name: weight_g
        description: Weight, grams.
        data_type: integer
      - name: length_cm
        description: Length, cm.
        data_type: integer
      - name: height_cm
        description: Height, cm.
        data_type: integer
      - name: width_cm
        description: Width, cm.
        data_type: integer
      - name: volume_cm3
        description: length × height × width, cm³.
        data_type: integer

  - name: fct_orders
    description: >
      One row per order with item, payment, delivery and review measures.
      `order_amount` = items + freight; `paid_amount` = what was paid (can differ: installment fees, vouchers).


      Accumulating snapshot fact: the row carries one timestamp per milestone of the
      order's life (purchase, approval, carrier handover, delivery, review survey sent,
      review answered), null until reached, plus the lag between consecutive
      milestones and `order_stage`, the furthest one reached. The table is rebuilt on
      every run, so a row always shows the order's current state; the milestones are
      not history (no row per change). Lags count calendar boundaries (`hours_` /
      `days_` prefix) and keep known source defects: a milestone recorded before the
      previous one gives a negative lag, flagged by the warn tests on the timestamps.
    config:
      group: orders
      contract:
        enforced: true
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: ref('stg_olist__orders')
      # Observability (Elementary, D38): each day of purchases against the days
      # before it. Warn only: an anomaly is a question for the business, not a bug.
      - elementary.volume_anomalies:
          description: >-
            Days with an unusual number of orders compared with the same weekday in
            the previous 14 weeks. A drop means orders stopped arriving (source feed or
            checkout broken); a spike is a campaign (Black Friday) or duplicated loads.
          # Each day vs the same weekday before it. With weekday seasonality
          # Elementary multiplies the training period by 7: 14 days = 14 weeks.
          arguments: &daily_anomalies
            timestamp_column: purchased_at
            time_bucket: {period: day, count: 1}
            training_period: {period: day, count: 14}
            detection_period: {period: day, count: 30}
            seasonality: day_of_week
          config: &anomaly_config
            severity: warn
            meta: {alert_unit: days}
      - elementary.freshness_anomalies:
          description: >-
            Days whose gap since the previous order is unusually long. New orders
            normally arrive every few minutes; a long gap means the feed stalled.
          arguments: *daily_anomalies
          config: *anomaly_config
      # The survey is a date, the purchase a timestamp: compared as dates
      - dbt_utils.expression_is_true:
          name: review_created_at_not_before_purchase_date_fct_orders
          description: >-
            Review surveys dated before the day the order was placed, which is
            impossible. Known source defect (61 orders); a rise means review or
            order dates are shifted in the feed.
          arguments:
            expression: "cast(review_created_at as date) >= purchase_date"
          config:
            severity: warn
            meta: {alert_unit: orders}
    columns:
      - name: order_id
        description: "{{ doc('order_id') }} Primary key."
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
        entity: {name: order, type: primary}
      - name: customer_unique_id
        description: "{{ doc('customer_unique_id') }}"
        data_type: string
        policy_tags: ["{{ var('pii_policy_tags')['person_id'] }}"]
        entity: {name: customer, type: foreign}
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: customer_key
        description: "Pseudonym of the person: SHA-256 of a secret key and `customer_unique_id`, the same in every mart. Untagged: readers without access to the id (the dashboard) count and join people on it (D94)."
        data_type: string
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_type: string
        dimension: categorical
      - name: order_stage
        description: >
          Furthest milestone reached: `purchased`, `approved`, `shipped` (handed to
          the carrier), `delivered`, `reviewed` (review answered). Fulfilment first: a
          review counts only after delivery, so a review of an undelivered order (a
          complaint about a lost shipment, a canceled order) leaves the order at its
          fulfilment stage. A skipped milestone doesn't hold the stage back (an order
          delivered without an approval timestamp is `delivered`).
        data_type: string
        dimension: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [purchased, approved, shipped, delivered, reviewed]
      - name: is_order_open
        description: >
          True while the order is in progress: status neither delivered nor canceled
          nor unavailable. An open order is stuck in its `order_stage` until it moves
          on; in the latest weeks of data most open orders are simply in flight.
        data_type: boolean
        dimension: categorical
        data_tests: [not_null]
      - name: purchase_date
        description: "{{ doc('purchase_date') }}"
        data_type: date
        dimension: {type: time}
        granularity: day
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: purchased_at
        description: Purchase timestamp.
        data_type: timestamp
      - name: approved_at
        description: Payment approval timestamp.
        data_type: timestamp
        data_tests:
          - is_not_before:
              arguments:
                earlier_column: purchased_at
      - name: delivered_to_carrier_at
        description: Handed over to the logistics partner.
        data_type: timestamp
        data_tests:
          - is_not_before:
              description: >-
                Orders handed to the carrier before the payment was approved. The
                approval-to-shipping time (seller handling KPI) is understated, even
                negative, for them. Known in Olist (1,359 orders, approval likely recorded
                late); a sharp rise means sellers ship unpaid orders or timestamps broke.
              arguments:
                earlier_column: approved_at
              config:
                severity: warn
                meta: {alert_unit: orders}
          - is_not_before:
              description: >-
                Orders handed to the carrier before the customer placed them, which is
                impossible. Shipping-time KPIs for these orders are wrong. Known source
                defect (166 orders); report a rise to the source system owner.
              arguments:
                earlier_column: purchased_at
              config:
                severity: warn
                meta: {alert_unit: orders}
      - name: delivered_to_customer_at
        description: Delivered to the customer.
        data_type: timestamp
        data_tests:
          - is_not_before:
              arguments:
                earlier_column: purchased_at
          - is_not_before:
              description: >-
                Orders delivered to the customer before the carrier picked them up, which
                is impossible. Their carrier transit time is negative, so the average
                transit time is understated. Known source defect (23 orders).
              arguments:
                earlier_column: delivered_to_carrier_at
              config:
                severity: warn
                meta: {alert_unit: orders}
      - name: estimated_delivery_date
        description: Delivery date promised to the customer at purchase.
        data_type: date
      - name: review_created_at
        description: >
          Review survey sent to the customer (date only, midnight), of the latest
          review; null if no review. Olist sends it about a day after delivery, or a
          few days after the estimated date while the order is still undelivered.
        data_type: timestamp
      - name: review_answered_at
        description: Customer answered the review survey (latest review); null if no review.
        data_type: timestamp
        data_tests:
          - is_not_before:
              arguments:
                earlier_column: review_created_at
      - name: items_count
        description: Number of line items (0 if the order has none).
        data_type: bigint
      - name: distinct_sellers_count
        description: Number of distinct sellers in the order.
        data_type: bigint
      - name: items_amount
        description: Sum of item prices, BRL.
        data_type: *money_type
      - name: freight_amount
        description: Sum of freight, BRL.
        data_type: *money_type
      - name: order_amount
        description: "{{ doc('order_amount') }}"
        data_type: *money_type
      - name: payments_count
        description: Number of payment records.
        data_type: bigint
      - name: paid_amount
        description: "{{ doc('paid_amount') }}"
        data_type: *money_type
        data_tests:
          - elementary.column_anomalies:
              description: >-
                Days with an unusual average paid amount per order. It moves with
                prices, vouchers and the product mix; a jump also follows a currency
                or decimal error in the payment feed.
              arguments:
                <<: *daily_anomalies
                column_anomalies: [average]
              config: *anomaly_config
      - name: max_installments
        description: Largest installment count among the order's payments.
        data_type: integer
      - name: credit_card_amount
        description: Paid by credit card, BRL.
        data_type: *money_type
      - name: boleto_amount
        description: Paid by boleto (bank slip), BRL.
        data_type: *money_type
      - name: voucher_amount
        description: Paid by voucher, BRL.
        data_type: *money_type
      - name: debit_card_amount
        description: Paid by debit card, BRL.
        data_type: *money_type
      - name: hours_to_approve
        description: Hours from purchase to approval (boundary count).
        data_type: bigint
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      # Non-negative unless the two milestones are out of order: a known source
      # defect, already flagged (warn) on the timestamps. Fails on a broken lag
      # formula without alerting the defect twice.
      - name: days_approved_to_carrier
        description: >
          Days from approval to the carrier handover (seller handling time, boundary
          count); null until both happened. Negative for orders handed over before
          the recorded approval.
        data_type: bigint
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 or delivered_to_carrier_at < approved_at"
      - name: days_carrier_to_customer
        description: >
          Days from the carrier handover to delivery (transit time, boundary count);
          null until delivered. Negative for orders delivered before the recorded handover.
        data_type: bigint
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 or delivered_to_customer_at < delivered_to_carrier_at"
      - name: days_delivered_to_review
        description: >
          Days from delivery to the review survey (boundary count); null unless
          delivered and reviewed. Negative when the survey went out before a late
          delivery (Olist sends it a few days after the estimated date), not a defect.
        data_type: bigint
      - name: hours_review_to_answer
        description: Hours from the review survey to the customer's answer (boundary count); null if no review.
        data_type: bigint
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: days_to_deliver
        description: Days from purchase to delivery; null if not delivered.
        data_type: bigint
      - name: days_delivered_before_estimate
        description: Estimated date − delivery date, days; negative = late.
        data_type: bigint
      - name: is_delivered
        description: True if a delivery timestamp exists.
        data_type: boolean
        dimension: categorical
      - name: is_delivered_late
        description: Delivered after the estimated date (date comparison); false if not delivered.
        data_type: boolean
        dimension: categorical
      - name: review_score
        description: Score of the latest review, 1–5; null if no review.
        data_type: integer
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
          - elementary.column_anomalies:
              description: >-
                Days with an unusual average review score. A drop points to late
                deliveries or a seller with bad products; check the delivery KPIs.
              arguments:
                <<: *daily_anomalies
                column_anomalies: [average]
              config: *anomaly_config
      - name: has_review
        description: True if the order has at least one review.
        data_type: boolean
    semantic_model:
      enabled: true
      name: orders
      group: orders
    agg_time_dimension: purchase_date
    metrics:
      - name: orders
        label: Orders
        description: Orders placed, any status.
        agg: count
        expr: order_id
        config: {group: orders}
      - name: sold_orders
        label: Sold orders
        description: Orders not canceled or unavailable.
        agg: count
        expr: order_id
        filter: &sold_filter |
          {{ Dimension('order__order_status') }} not in ('canceled', 'unavailable')
        config: {group: orders}
      - name: revenue
        label: Revenue, BRL
        description: Items + freight of sold orders (not canceled or unavailable).
        agg: sum
        expr: order_amount
        filter: *sold_filter
        config: {group: orders}
      - name: average_order_value
        label: Average order value, BRL
        description: Revenue per sold order.
        type: ratio
        numerator: revenue
        denominator: sold_orders
        config: {group: orders}
      - name: customers
        label: Customers
        description: Distinct people who ordered in the period.
        agg: count_distinct
        expr: customer_unique_id
        config: {group: orders}
      - name: revenue_per_customer
        label: Revenue per customer, BRL
        description: Revenue / customers who ordered in the period.
        type: ratio
        numerator: revenue
        denominator: customers
        config: {group: orders}
      - name: delivered_orders
        label: Delivered orders
        description: Orders with a delivery timestamp.
        agg: count
        expr: order_id
        filter: |
          {{ Dimension('order__is_delivered') }} = true
        config: {group: orders}
      - name: late_deliveries
        label: Late deliveries
        description: Orders delivered after the date promised at purchase.
        agg: count
        expr: order_id
        filter: |
          {{ Dimension('order__is_delivered_late') }} = true
        config: {group: orders}
      - name: late_delivery_rate
        label: Late delivery rate
        description: Share of delivered orders that arrived after the promised date.
        type: ratio
        numerator: late_deliveries
        denominator: delivered_orders
        config: {group: orders}
      - name: avg_days_to_deliver
        label: Avg days to deliver
        description: Purchase to delivery, days; delivered orders only (null otherwise).
        agg: average
        expr: days_to_deliver
        config: {group: orders}
      - name: avg_review_score
        label: Avg review score
        description: Average latest review score, 1–5, of reviewed orders.
        agg: average
        expr: review_score
        config: {group: orders}
      # Order funnel (accumulating snapshot): median time per stage, and orders
      # stuck in a stage, i.e. open (not delivered, canceled or unavailable) at it.
      # Medians are approximate: dbt-core 1.12 turns `percentile_type: continuous`
      # into MetricFlow's approximate continuous percentile, the only one it has on
      # BigQuery (APPROX_QUANTILES). Close to exact on these whole-hour/day lags.
      - name: median_hours_to_approve
        label: Median hours to approve
        description: "Stage 1, payment: purchase to approval, hours; approved orders."
        agg: percentile
        percentile: 0.5
        percentile_type: continuous
        expr: hours_to_approve
        config: {group: orders}
      - name: median_days_approved_to_carrier
        label: Median days approved to carrier
        description: "Stage 2, seller handling: approval to carrier handover, days; shipped orders."
        agg: percentile
        percentile: 0.5
        percentile_type: continuous
        expr: days_approved_to_carrier
        config: {group: orders}
      - name: median_days_carrier_to_customer
        label: Median days in transit
        description: "Stage 3, transit: carrier handover to delivery, days; delivered orders."
        agg: percentile
        percentile: 0.5
        percentile_type: continuous
        expr: days_carrier_to_customer
        config: {group: orders}
      - name: median_days_delivered_to_review
        label: Median days delivered to review
        description: "Stage 4, review: delivery to the review survey, days; delivered, reviewed orders. Negative = survey before a late delivery."
        agg: percentile
        percentile: 0.5
        percentile_type: continuous
        expr: days_delivered_to_review
        config: {group: orders}
      - name: median_hours_review_to_answer
        label: Median hours to answer review
        description: Review survey to the customer's answer, hours; reviewed orders.
        agg: percentile
        percentile: 0.5
        percentile_type: continuous
        expr: hours_review_to_answer
        config: {group: orders}
      - name: approved_orders
        label: Approved orders
        description: Orders that reached approval or a later stage.
        agg: count
        expr: order_id
        filter: |
          {{ Dimension('order__order_stage') }} <> 'purchased'
        config: {group: orders}
      - name: shipped_orders
        label: Shipped orders
        description: Orders handed to the carrier, or further.
        agg: count
        expr: order_id
        filter: |
          {{ Dimension('order__order_stage') }} in ('shipped', 'delivered', 'reviewed')
        config: {group: orders}
      - name: orders_awaiting_approval
        label: Orders awaiting approval
        description: Open orders not approved yet (stuck at `purchased`).
        # A 0/1 sum, not a filtered count: a period with no stuck order is 0, not
        # null, and so is its rate (dbt-core 1.12 drops `fill_nulls_with` on v2 metrics)
        agg: sum
        expr: case when order_stage = 'purchased' and is_order_open then 1 else 0 end
        config: {group: orders}
      - name: orders_awaiting_shipping
        label: Orders awaiting shipping
        description: Open approved orders not handed to the carrier yet (stuck at `approved`).
        agg: sum
        expr: case when order_stage = 'approved' and is_order_open then 1 else 0 end
        config: {group: orders}
      - name: orders_in_transit
        label: Orders in transit
        description: Open orders with the carrier, not delivered yet (stuck at `shipped`).
        agg: sum
        expr: case when order_stage = 'shipped' and is_order_open then 1 else 0 end
        config: {group: orders}
      - name: awaiting_approval_rate
        label: Share awaiting approval
        description: Orders awaiting approval / orders placed.
        type: ratio
        numerator: orders_awaiting_approval
        denominator: orders
        config: {group: orders}
      - name: awaiting_shipping_rate
        label: Share awaiting shipping
        description: Orders awaiting shipping / approved orders.
        type: ratio
        numerator: orders_awaiting_shipping
        denominator: approved_orders
        config: {group: orders}
      - name: in_transit_rate
        label: Share in transit
        description: Orders in transit / shipped orders. High in the latest weeks (orders in flight); older periods show orders never delivered.
        type: ratio
        numerator: orders_in_transit
        denominator: shipped_orders
        config: {group: orders}

  - name: fct_order_items
    description: >
      One row per order line item. Incremental (merge on `order_item_sk`): a run
      processes only items whose raw item or order row was loaded since the last run.
    config:
      group: orders
      contract:
        enforced: true
    data_tests:
      - elementary.volume_anomalies:
          description: >-
            Days with an unusual number of sold items compared with the same weekday in
            the previous 14 weeks. Read together with the order volume: items moving
            alone means larger or smaller baskets, or items loaded without their orders.
          arguments: *daily_anomalies
          config: *anomaly_config
    columns:
      - name: order_item_sk
        description: Surrogate key (order_id, order_item_number). Primary key.
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: order_item_number
        description: Line number within the order, from 1.
        data_type: integer
      - name: product_id
        description: Product of the line.
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        description: Seller of the line.
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: customer_unique_id
        description: "{{ doc('customer_unique_id') }}"
        data_type: string
        policy_tags: ["{{ var('pii_policy_tags')['person_id'] }}"]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_type: string
      - name: purchase_date
        description: "{{ doc('purchase_date') }}"
        data_type: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: purchased_at
        description: Purchase timestamp of the order.
        data_type: timestamp
      - name: shipping_limit_at
        description: Deadline for the seller to hand the item to the carrier.
        data_type: timestamp
        data_tests:
          - is_not_before:
              arguments:
                earlier_column: purchased_at
      - name: price
        description: Item price, BRL.
        data_type: *money_type
      - name: freight_value
        description: Freight allocated to the item, BRL.
        data_type: *money_type
      - name: item_amount
        description: price + freight_value, BRL.
        data_type: *money_type
      - name: _loaded_at
        description: "{{ doc('loaded_at') }} Latest of the item's and its order's raw load; incremental cursor."
        # An instant everywhere: dlt loads tz-aware timestamps as TIMESTAMP_LTZ on Snowflake
        data_type: "{{ 'timestamp' if target.type in ['bigquery', 'databricks'] else 'timestamp_ltz' if target.type == 'snowflake' else 'timestamp with time zone' }}"
        data_tests: [not_null]

  - name: fct_order_items_seller_as_of
    description: >
      One row per order line item with the seller as of the purchase: the version of
      `dim_sellers_history` whose range holds `purchased_at`. Use it for "where was the
      seller when the sale happened"; `fct_order_items` joins to `dim_sellers`, today's
      state.
    config:
      group: orders
      contract:
        enforced: true
    data_tests:
      # The left join neither drops nor duplicates items
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('fct_order_items')
    columns:
      - name: order_item_sk
        description: Surrogate key (order_id, order_item_number). Primary key.
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_type: string
      - name: seller_id
        description: Seller of the line.
        data_type: string
      - name: purchased_at
        description: Purchase timestamp of the order; the point in time of the join.
        data_type: timestamp
      - name: seller_version_id
        description: Seller version current at the purchase.
        data_type: string
        data_tests:
          # Every item finds a version: the ranges cover all time
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers_history')
                field: seller_version_id
      - name: seller_zip_code_prefix
        description: "{{ doc('zip_code_prefix') }} Seller's, as of the purchase."
        data_type: string
      - name: seller_city
        description: Seller city as of the purchase.
        data_type: string
      - name: seller_state
        description: Seller state as of the purchase.
        data_type: string
      - name: seller_latitude
        description: "{{ doc('latitude') }}"
        data_type: *float_type
      - name: seller_longitude
        description: "{{ doc('longitude') }}"
        data_type: *float_type
      - name: is_seller_version_current
        description: False when the seller has changed (or disappeared) since the purchase.
        data_type: boolean

  - name: fct_shipments
    description: >
      Delivery performance against distance: one row per shipment, i.e. the items of one seller in
      one order. The seller is located where it was at the purchase (SCD2 history), the customer at the
      order's zip prefix; both at their zip centroid, so `distance_km` is centroid to centroid
      (haversine, `haversine_km`). Olist records one delivery date per order, shared by its shipments.
    config:
      group: orders
      contract:
        enforced: true
    columns:
      - name: shipment_sk
        description: Surrogate key (order_id, seller_id). Primary key.
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests: [unique, not_null]
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: seller_id
        description: The seller shipping these items.
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: purchase_date
        description: Order purchase date.
        data_type: date
      - name: seller_state
        description: Seller state as of the purchase.
        data_type: string
      - name: customer_state
        description: Two-letter state code of the customer's address on the order.
        data_type: string
      - name: is_same_state
        description: Seller and customer in the same state; null if either state is unknown.
        data_type: boolean
      - name: distance_km
        description: Great-circle distance from the seller's to the customer's zip centroid, km; null if either has no coordinates.
        data_type: *float_type
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              description: >-
                Shipments longer than 5,000 km, more than any distance within Brazil. A zip centroid
                lies outside the country: geolocation has a few points abroad or at sea (source
                defect, a handful of shipments); a jump means coordinates or the formula broke.
              arguments:
                min_value: 0
                max_value: 5000
              config:
                severity: warn
                meta: {alert_unit: shipments}
      - name: distance_band
        description: "Distance in bands: 0-100, 100-500, 500-1000, 1000-2000, 2000+ km, or unknown."
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0-100 km', '100-500 km', '500-1000 km', '1000-2000 km', '2000+ km', unknown]
      - name: items_count
        description: Order items this seller ships in the order.
        data_type: bigint
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: is_delivered
        description: True if the order has a delivery timestamp.
        data_type: boolean
      - name: days_to_deliver
        description: Days from purchase to delivery; null if not delivered.
        data_type: bigint
      - name: is_delivered_late
        description: Delivered after the estimated date (date comparison); false if not delivered.
        data_type: boolean

  - name: fct_review_topics
    description: >
      What customers write about: one row per order whose review has a label (D92). Sentiment and topic
      come from the review text, labelled by Claude following `ingestion/review_labels/guidelines.md`,
      with an English translation; the order's delivery outcome sits next to them, so complaints can be
      compared with actual late deliveries. Reviews without text have no row, nor do texts the ingest
      could not label yet.
    config:
      group: orders
      contract:
        enforced: true
    columns:
      - name: order_id
        description: "{{ doc('order_id') }} Primary key."
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: review_id
        description: The order's latest review (as `fct_orders.review_score`).
        data_type: string
        data_tests: [not_null]
      - name: purchase_date
        description: Order purchase date.
        data_type: date
      - name: customer_state
        description: Two-letter state code of the customer's address on the order.
        data_type: string
      - name: category_name
        description: English category of the order's most expensive item ('unknown' if the product has none); null if the order has no items.
        data_type: string
      - name: review_score
        description: Customer rating, 1–5.
        data_type: integer
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: sentiment
        description: The customer's attitude in the text, not the score - positive, negative, mixed or neutral.
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [positive, negative, mixed, neutral]
      - name: topic
        description: >
          The one aspect the review is mainly about - delivery, product_quality, wrong_or_missing_item,
          seller_service, general (overall satisfaction, no aspect) or other (price, packaging, payment, ...).
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [delivery, product_quality, wrong_or_missing_item, seller_service, general, other]
      - name: translation_en
        description: English translation of the review title and message.
        data_type: string
        data_tests: [not_null]
      - name: is_delivered
        description: True if a delivery timestamp exists.
        data_type: boolean
      - name: is_delivered_late
        description: Delivered after the estimated date (date comparison); false if not delivered.
        data_type: boolean
      - name: days_delivered_before_estimate
        description: Estimated date − delivery date, days; negative = late.
        data_type: bigint
      - name: labeled_by
        description: Who labelled the review, e.g. `claude-code-session` (hand-checked gold set), `claude-code-routine-<model>` (backfill) or `claude-api-haiku-5-5` (new reviews).
        data_type: string
