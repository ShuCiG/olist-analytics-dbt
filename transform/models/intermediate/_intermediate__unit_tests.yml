version: 2

unit_tests:
  - name: test_payments_pivot_sums_per_type
    model: int_payments_pivoted_to_orders
    description: >
      Multiple payments of one type are summed; absent types are 0, not null.
      An unknown payment type (Olist has 'not_defined') counts toward the total
      but lands in no per-type bucket.
    given:
      - input: ref('stg_olist__order_payments')
        rows:
          - {order_id: o1, payment_type: credit_card, payment_installments: 3, payment_value: 100.00}
          - {order_id: o1, payment_type: voucher, payment_installments: 1, payment_value: 20.00}
          - {order_id: o1, payment_type: voucher, payment_installments: 1, payment_value: 5.50}
          - {order_id: o2, payment_type: boleto, payment_installments: 1, payment_value: 50.00}
          - {order_id: o3, payment_type: not_defined, payment_installments: 1, payment_value: 10.00}
    expect:
      rows:
        - {order_id: o1, credit_card_amount: 100.00, boleto_amount: 0, voucher_amount: 25.50,
           debit_card_amount: 0, payments_count: 3, max_installments: 3, total_payment_value: 125.50}
        - {order_id: o2, credit_card_amount: 0, boleto_amount: 50.00, voucher_amount: 0,
           debit_card_amount: 0, payments_count: 1, max_installments: 1, total_payment_value: 50.00}
        - {order_id: o3, credit_card_amount: 0, boleto_amount: 0, voucher_amount: 0,
           debit_card_amount: 0, payments_count: 1, max_installments: 1, total_payment_value: 10.00}

  - name: test_delivery_metrics_lateness_rules
    model: int_orders_delivery_metrics
    description: >
      Lateness compares dates, not timestamps: delivery late in the evening of the
      estimated day is on time. Undelivered orders get null durations and are not late.
      Timestamps avoid midnight-crossing intervals so results match on DuckDB and BigQuery.
    given:
      - input: ref('stg_olist__orders')
        rows:
          - order_id: early
            purchased_at: 2018-01-01 10:00:00
            approved_at: 2018-01-01 13:00:00
            delivered_to_customer_at: 2018-01-08 15:00:00
            estimated_delivery_date: 2018-01-15
          - order_id: on_estimate_day
            purchased_at: 2018-02-01 09:00:00
            approved_at: 2018-02-01 09:00:00
            delivered_to_customer_at: 2018-02-10 23:00:00
            estimated_delivery_date: 2018-02-10
          - order_id: late
            purchased_at: 2018-03-01 08:00:00
            approved_at: 2018-03-02 08:00:00
            delivered_to_customer_at: 2018-03-20 12:00:00
            estimated_delivery_date: 2018-03-15
          - order_id: undelivered
            purchased_at: 2018-04-01 08:00:00
            approved_at: null
            delivered_to_customer_at: null
            estimated_delivery_date: 2018-04-20
    expect:
      rows:
        - {order_id: early, hours_to_approve: 3, days_to_deliver: 7, days_delivered_before_estimate: 7,
           is_delivered: true, is_delivered_late: false}
        - {order_id: on_estimate_day, hours_to_approve: 0, days_to_deliver: 9, days_delivered_before_estimate: 0,
           is_delivered: true, is_delivered_late: false}
        - {order_id: late, hours_to_approve: 24, days_to_deliver: 19, days_delivered_before_estimate: -5,
           is_delivered: true, is_delivered_late: true}
        - {order_id: undelivered, hours_to_approve: null, days_to_deliver: null,
           days_delivered_before_estimate: null, is_delivered: false, is_delivered_late: false}

  - name: test_delivery_metrics_stage_lags
    model: int_orders_delivery_metrics
    description: >
      Stage lags count day boundaries between consecutive milestones. A carrier
      handover recorded before the approval (a known source defect) keeps its
      negative lag instead of being hidden; a missing milestone gives null.
    given:
      - input: ref('stg_olist__orders')
        rows:
          - order_id: in_order
            purchased_at: 2018-01-01 10:00:00
            approved_at: 2018-01-01 11:00:00
            delivered_to_carrier_at: 2018-01-03 09:00:00
            delivered_to_customer_at: 2018-01-08 15:00:00
          - order_id: carrier_before_approval
            purchased_at: 2018-02-01 10:00:00
            approved_at: 2018-02-05 10:00:00
            delivered_to_carrier_at: 2018-02-04 10:00:00
            delivered_to_customer_at: 2018-02-09 10:00:00
          - order_id: in_transit
            purchased_at: 2018-03-01 10:00:00
            approved_at: 2018-03-01 10:00:00
            delivered_to_carrier_at: 2018-03-02 10:00:00
            delivered_to_customer_at: null
    expect:
      rows:
        - {order_id: in_order, days_approved_to_carrier: 2, days_carrier_to_customer: 5}
        - {order_id: carrier_before_approval, days_approved_to_carrier: -1, days_carrier_to_customer: 5}
        - {order_id: in_transit, days_approved_to_carrier: 1, days_carrier_to_customer: null}

  - name: test_order_stage_fulfilment_first
    model: int_orders_staged
    description: >
      The stage is the furthest milestone reached. A review moves an order to
      `reviewed` only once it is delivered: a review of a shipment that never
      arrived leaves it `shipped`. Open = not delivered, canceled or unavailable,
      so a canceled order is not stuck. A survey sent before a late delivery gives
      a negative delivery-to-review lag.
    given:
      - input: ref('stg_olist__orders')
        rows:
          - {order_id: placed, order_status: created, purchased_at: 2018-01-01 10:00:00}
          - {order_id: paid, order_status: processing, purchased_at: 2018-01-01 10:00:00,
             approved_at: 2018-01-01 11:00:00}
          - {order_id: canceled_after_approval, order_status: canceled, purchased_at: 2018-01-01 10:00:00,
             approved_at: 2018-01-01 11:00:00}
          - {order_id: lost_in_transit, order_status: shipped, purchased_at: 2018-01-01 10:00:00,
             approved_at: 2018-01-01 11:00:00, delivered_to_carrier_at: 2018-01-02 11:00:00}
          - {order_id: delivered, order_status: delivered, purchased_at: 2018-01-01 10:00:00,
             approved_at: 2018-01-01 11:00:00, delivered_to_carrier_at: 2018-01-02 11:00:00,
             delivered_to_customer_at: 2018-01-08 15:00:00}
          - {order_id: reviewed, order_status: delivered, purchased_at: 2018-01-01 10:00:00,
             approved_at: 2018-01-01 11:00:00, delivered_to_carrier_at: 2018-01-02 11:00:00,
             delivered_to_customer_at: 2018-01-08 15:00:00}
          - {order_id: reviewed_before_late_delivery, order_status: delivered, purchased_at: 2018-01-01 10:00:00,
             approved_at: 2018-01-01 11:00:00, delivered_to_carrier_at: 2018-01-02 11:00:00,
             delivered_to_customer_at: 2018-01-20 15:00:00}
      - input: ref('int_order_reviews_deduplicated')
        rows:
          - {order_id: lost_in_transit, review_created_at: 2018-01-25 00:00:00,
             review_answered_at: 2018-01-26 08:00:00}
          - {order_id: reviewed, review_created_at: 2018-01-09 00:00:00,
             review_answered_at: 2018-01-10 16:00:00}
          - {order_id: reviewed_before_late_delivery, review_created_at: 2018-01-17 00:00:00,
             review_answered_at: 2018-01-17 09:00:00}
    expect:
      rows:
        - {order_id: placed, order_stage: purchased, is_order_open: true,
           days_delivered_to_review: null, hours_review_to_answer: null}
        - {order_id: paid, order_stage: approved, is_order_open: true,
           days_delivered_to_review: null, hours_review_to_answer: null}
        - {order_id: canceled_after_approval, order_stage: approved, is_order_open: false,
           days_delivered_to_review: null, hours_review_to_answer: null}
        - {order_id: lost_in_transit, order_stage: shipped, is_order_open: true,
           days_delivered_to_review: null, hours_review_to_answer: 32}
        - {order_id: delivered, order_stage: delivered, is_order_open: false,
           days_delivered_to_review: null, hours_review_to_answer: null}
        - {order_id: reviewed, order_stage: reviewed, is_order_open: false,
           days_delivered_to_review: 1, hours_review_to_answer: 40}
        - {order_id: reviewed_before_late_delivery, order_stage: reviewed, is_order_open: false,
           days_delivered_to_review: -3, hours_review_to_answer: 9}
