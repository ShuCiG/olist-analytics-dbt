version: 2

# Properties of the singular tests in this folder. Descriptions are written for
# business readers: the alert emails quote them next to the failing row count.
data_tests:
  - name: assert_payments_match_order_amount
    description: >-
      Orders where the amount paid differs from items + freight by more than R$ 1.
      Revenue from payments and revenue from order lines don't reconcile for them.
      Mostly installment interest and vouchers (about 250 orders in the full data);
      a jump means missing payments or wrong prices.
    config:
      meta: {alert_unit: orders, decision: D10}

  - name: assert_revenue_reconciles_with_payments
    description: >-
      Revenue (items + freight of sold orders) and the payments received for the same
      orders differ by more than 0.5%. Installment fees, vouchers and orders without
      items explain about 0.02% in the full data; more means payments or prices are
      missing or wrong. The check passes or fails once per build, so it counts one failure.
    config:
      meta: {alert_unit: totals}

  - name: assert_order_items_sum_to_order_amount
    description: >-
      Orders whose line items don't add up to the order total in fct_orders. This
      breaks the model itself (the two facts must reconcile exactly), so it fails the
      build; check the latest change to fct_orders / fct_order_items.
    config:
      meta: {alert_unit: orders}

  - name: assert_order_items_loaded_with_their_order
    description: >-
      Order lines whose load time differs from their order's. The loader brings an
      order and its lines in one batch; the incremental fct_order_items relies on it
      and skips lines whose order was reloaded alone. A failure means order lines
      in fct_order_items may show an outdated order status: run a full refresh of
      fct_order_items and check the loader.
    config:
      meta: {alert_unit: order lines}

  - name: assert_dim_date_week_of_year
    description: >-
      Calendar days whose week_of_year is not the Sunday-start week (BigQuery
      EXTRACT(WEEK)). Reports grouped by week_of_year would put days in the wrong
      week on this engine; check macros/week_of_year.sql and the dbt_date dispatch.
    config:
      meta: {alert_unit: days}

  - name: assert_haversine_known_distances
    description: >-
      City pairs whose distance from the haversine_km macro is more than 0.5 km off a value
      computed independently (São Paulo–Rio 360.75 km, São Paulo–Manaus, Porto Alegre–Manaus,
      a point to itself 0, null for a missing coordinate). A failure means the distance formula is wrong on this engine,
      so every seller-to-customer distance is too.
    config:
      meta: {alert_unit: city pairs}

  - name: assert_holidays_cover_every_year
    description: >-
      Years from 2016 to next year with fewer than 8 national holidays loaded (Brazil has 10+).
      `dim_date.is_holiday` is false for every day of such a year, so holiday comparisons are
      wrong without any other sign. The loader brings next year in the first run of a year: look at
      the holiday feed (BrasilAPI, Nager.Date) and the ingest log, then rerun the ingest.
    config:
      meta: {alert_unit: years}

  - name: assert_weather_covers_every_order_day
    description: >-
      State and day pairs without weather between the first purchase and the last delivery. The weather
      columns of `fct_order_weather` are silently null for those days, so rain-vs-delay results are wrong
      without any other sign. Look at the weather feed (Open-Meteo) and the ingest log, then rerun the ingest.
    config:
      meta: {alert_unit: state-days}
